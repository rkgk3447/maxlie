<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Requiem for a Rose</title>
    <style>
      @font-face {
        font-family: "Paper Cut Caps";
        src: url("MISC%20ASSETS/PaperCutCaps.woff") format("woff"),
          url("MISC%20ASSETS/PaperCutCaps.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        --bg: #0e0f12;
        --panel: #171a1e;
        --panel-alt: #101317;
        --carpet-pattern: url('MISC%20ASSETS/carpet.png');
        --carpet-plum: #1a1b1e;
        --carpet-blood: 122, 8, 15;
        --carpet-crimson: 68, 13, 17;
        --carpet-charcoal: 38, 39, 42;
        --carpet-gradient: linear-gradient(135deg, rgb(var(--carpet-blood)) 0%, rgb(var(--carpet-crimson)) 55%, rgb(var(--carpet-charcoal)) 100%);
        --carpet-gradient-mid: linear-gradient(135deg, rgba(var(--carpet-blood), 0.62) 0%, rgba(var(--carpet-crimson), 0.62) 55%, rgba(var(--carpet-charcoal), 0.62) 100%);
        --carpet-gradient-soft: linear-gradient(135deg, rgba(var(--carpet-blood), 0.34) 0%, rgba(var(--carpet-crimson), 0.34) 55%, rgba(var(--carpet-charcoal), 0.34) 100%);
        --card: rgba(255, 255, 255, 0.026);
        --card-border: rgba(255, 255, 255, 0.09);
        --text: #f2f4f8;
        --muted: #bcc5d4;
        --accent: #d9d9d9;
        --accent-strong: #b5b5b5;
        --soft: rgba(255, 255, 255, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: "Lancelot", serif;
        background-color: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: center;
        min-height: 100vh;

      }

      .app {
        width: 100%;
        max-width: 1800px;
        height: 100vh;
        display: flex;
        overflow: hidden;
        background: rgba(10, 11, 15, 0.64);
      }

      .sentence-panel {
        flex: 1.8;
        min-width: 0;
        position: relative;
        background: rgba(17, 19, 23, 0.76);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }

      .sentence-list {
        height: 100%;
        overflow: hidden;
        padding: 18px 18px 20px;
        position: relative;
        background: linear-gradient(to bottom, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
        isolation: isolate;
      }

      .sentence-list::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: var(--carpet-pattern);
        background-repeat: repeat;
        background-position: center center;
        background-size: 512px 512px;
        opacity: 0.12;
        z-index: -1;
      }

      .sentence-track {
        will-change: transform;
        position: relative;
        z-index: 10;
      }

      .sentence-item {
        position: relative;
        display: block;
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 10px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.02);
        color: rgba(242, 244, 248, 0.68);
        font-size: 0.98rem;
        line-height: 1.55;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        filter: blur(1.6px);
        transition: color 0.18s ease, opacity 0.18s ease;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .sentence-item::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px,
          transparent 7px
        );
        opacity: 0.55;
      }

      .category-panel {
        width: clamp(380px, 30vw, 440px);
        min-width: 260px;
        flex-shrink: 0;
        background: rgba(14, 15, 18, 0.78);
        padding: 26px 18px 18px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }

      .title {
        margin: 0;
        font-size: clamp(2rem, 2.4vw, 2.8rem);
        line-height: 1.1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-align: center;
        color: #fff;
      }

      .title::first-letter {
        display: inline-block;
        font-size: 1.32em;
        vertical-align: -0.06em;
      }

      h1,
      .title {
        font-family: "Paper Cut Caps", Impact, sans-serif;
        flex: 0 0 auto;
        text-align: center;
      }

      .category-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 0 0 auto;
      overflow-y: auto; 
      scrollbar-width: thin;
      scrollbar-color: #7a0d0d rgba(255, 255, 255, 0.05); 
    }

    .category-list::-webkit-scrollbar {
      width: 10px;
    }

    .category-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
    }

    .category-list::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #b60a0a, #5a0606);
      border-radius: 6px;
      border: 2px solid rgba(12, 13, 16, 0.92);
    }

    .category-list::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #d61111, #7a0d0d);
    }

      .category-button {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 14px 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background-color: var(--carpet-plum);
        background-image: var(--carpet-gradient-soft);
        backdrop-filter: blur(10px) saturate(1.1);
        -webkit-backdrop-filter: blur(10px) saturate(1.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), inset 0 -1px 0 rgba(0, 0, 0, 0.35);
        color: var(--text);
        text-align: left;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, filter 0.12s ease, box-shadow 0.15s ease;
      }

      .category-button:hover {
        background-image: var(--carpet-gradient-mid);
        border-color: rgba(255, 255, 255, 0.22);
      }

      .category-button:active,
      .category-button.pressed {
        border-color: rgba(255, 255, 255, 0.08);
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .category-button.active {
        background-image: var(--carpet-gradient);
        border-color: transparent;
        color: #fff;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 0 rgba(0, 0, 0, 0.3), 0 0 18px rgba(var(--carpet-crimson), 0.35);
      }

      .category-button:not(.active):not(.is-locked) {
        color: rgba(180, 184, 192, 0.68);
      }

      .category-button.active:active,
      .category-button.active.pressed {
        filter: brightness(0.72) saturate(0.8);
      }

      .category-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .category-button.is-locked,
      .category-button.is-locked:hover,
      .category-button.is-locked:active {
        background-image: none;
        background-color: rgba(30, 8, 31, 0.55);
        border: 1px dashed rgba(255, 255, 255, 0.16);
        color: rgba(242, 244, 248, 0.42);
        box-shadow: none;
        filter: none;
        transform: none;
        cursor: not-allowed;
      }

      .category-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
        color: rgba(242, 244, 248, 0.6);
      }

      .category-button.shake {
        animation: category-shake 0.32s ease;
      }

      @keyframes category-shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-5px); }
        40% { transform: translateX(5px); }
        60% { transform: translateX(-3px); }
        80% { transform: translateX(3px); }
      }

      .action-row {
        display: flex;
        align-items: stretch;
        gap: 10px;
      }

      .spin-button {
        flex: 1;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: var(--panel-alt);
        color: var(--text);
        padding: 14px 8px;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, filter 0.12s ease;
      }

      .spin-button:hover {
        background: #171b21;
      }

      .spin-button:active,
      .spin-button.pressed {
        background: #0c0e11;
        border-color: rgba(255, 255, 255, 0.12);
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .spin-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .history-button {

        width: clamp(52px, 6vw, 76px);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: var(--panel-alt);
        aspect-ratio: 1;
        padding: 0;
        overflow: hidden;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, filter 0.12s ease;
      }

      .history-button:hover {
        background: #171b21;
      }

      .history-button:active,
      .history-button.pressed {
        background: #0c0e11;
        border-color: rgba(255, 255, 255, 0.12);
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .history-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .history-button-icon {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: fill;
        pointer-events: none;
        user-select: none;
      }

      .history-button:active .history-button-icon,
      .history-button.pressed .history-button-icon {
        filter: brightness(0.7) saturate(0.8);
      }

      .history-button.is-animating .history-button-icon {
        transform: scale(1.04);
      }

      .winner-overlay,
      .history-overlay,
      .confirm-overlay,
      .afk-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease, visibility 0.2s ease;
        z-index: 201;
      }

      .winner-overlay.visible,
      .history-overlay.visible,
      .confirm-overlay.visible,
      .afk-overlay.visible {
        opacity: 1;
        visibility: visible;
      }

     
      .ghost-overlay {
        position: absolute; 
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transform: translateY(70px);
        transition: opacity 0.5s ease-in, transform 0.5s cubic-bezier(0.5, 0, 1, 1),
          visibility 0s linear 0.5s;
        z-index: 1; 
      }

      .ghost-overlay.visible {
        opacity: 0.85;
        visibility: visible;
        transform: translateY(0);
        transition: opacity 0.2s ease-out, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
          visibility 0s linear 0s;
      }

  
      .ghost-viewport {
        position: relative;
        overflow: hidden;
        width: min(58vw, 480px);
        height: calc(100% - clamp(20px, 4vh, 40px));
        margin-top: clamp(20px, 4vh, 40px);
      }

      .ghost-img {
        position: absolute;
        top: 50%;
        left: 50%;
        object-fit: cover;
        
        object-position: 100% 50%;
        transform: translate(-50%, -50%) rotate(-90deg);
        transform-origin: center center;
        will-change: transform;
        user-select: none;
        -webkit-user-drag: none;
       
      }

      @media (max-width: 900px) {
        .ghost-viewport {
          width: min(78vw, 420px);
        }
      }

      .winner-card {
        position: relative;
        width: min(760px, 90vw);
        background: rgba(12, 13, 16, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 30px 26px;
        text-align: center;
        overflow: hidden;
        isolation: isolate;
      }


        .winner-card::before {
          content: "";
          position: absolute;
          inset: 0;
          background: var(--rose-pattern, url('Maxblonda/whiterose.png')) center center / cover no-repeat;
          opacity: 0.20;
          z-index: 0;
          pointer-events: none;
}
          :root {
            --rose-pattern: url('Maxblonda/whiterose.png');
          }


      .winner-card > * {
        position: relative;
        z-index: 1;
      }

      .history-card {
        width: min(760px, 90vw);
        max-height: 80vh;
        overflow-y: auto;
        background: rgba(12, 13, 16, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 30px 26px;
        text-align: left;
        scrollbar-width: thin;
        scrollbar-color: #7a0d0d rgba(255, 255, 255, 0.05);
      }

      .history-card::-webkit-scrollbar {
        width: 10px;
      }

      .history-card::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.04);
      }

      .history-card::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #b60a0a, #5a0606);
        border-radius: 6px;
        border: 2px solid rgba(12, 13, 16, 0.92);
      }

      .history-card::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #d61111, #7a0d0d);
      }

      .history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .clear-history-button {
        background: transparent;
        border: 1px solid rgba(182, 10, 10, 0.45);
        color: #ff6b6b;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 7px 12px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease, filter 0.12s ease, transform 0.12s ease;
      }

      .clear-history-button:hover {
        background: rgba(182, 10, 10, 0.16);
        border-color: rgba(182, 10, 10, 0.8);
      }

      .clear-history-button:active,
      .clear-history-button.pressed {
        background: rgba(182, 10, 10, 0.08);
        border-color: rgba(182, 10, 10, 0.75);
        color: #d75f5f;
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .clear-history-button:disabled {
        border-color: rgba(120, 120, 120, 0.65);
        background: rgba(90, 90, 90, 0.18);
        color: rgba(200, 200, 200, 0.8);
        cursor: not-allowed;
        opacity: 0.7;
      }

      .clear-history-button:disabled:hover {
        background: rgba(90, 90, 90, 0.18);
        border-color: rgba(120, 120, 120, 0.65);
      }

      .history-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 14px;
      }

      .history-entry {
        display: flex;
        flex-direction: column;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .history-entry-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
      }

      .history-entry-text {
        color: #f7f9ff;
        line-height: 1.5;
        user-select: none;
      }

      .history-entry-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .spoiler-button {
        flex-shrink: 0;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: var(--text);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 5px 10px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, filter 0.12s ease, transform 0.12s ease;
      }

      .spoiler-button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .spoiler-button:active,
      .spoiler-button.pressed {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.18);
        color: rgba(242, 244, 248, 0.9);
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .history-entry-date {
        flex-shrink: 0;
        color: var(--muted);
        font-size: 0.85rem;
        white-space: nowrap;
      }

      .history-entry-origin {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        margin-top: 0;
        color: #9a9a9a;
        font-size: 0.85rem;
        font-style: italic;
        line-height: 1.5;
        user-select: none;
        transition: max-height 0.25s ease, opacity 0.2s ease, margin-top 0.25s ease;
      }

      .history-entry-origin.visible {
        max-height: 200px;
        opacity: 1;
        margin-top: 8px;
      }

      .history-empty {
        color: var(--muted);
        margin: 0;
      }

      .winner-label {
        display: inline-block;
        margin-bottom: 12px;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .winner-text {
        margin: 0;
        font-size: clamp(1.25rem, 2vw, 2.2rem);
        line-height: 1.55;
        color: #f7f9ff;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      @media (max-width: 900px) {
        .app {
          flex-direction: column;
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }

        .sentence-panel {
          min-height: 58vh;
          border-right: none;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .category-panel {
          width: 100%;
          min-width: 0;
        }

      }

    
      .afk-card {
        position: relative;
        width: min(560px, 90vw);
        background: rgba(12, 13, 16, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 26px 24px;
        text-align: center;
      }

      .afk-text {
        margin: 0;
        font-size: clamp(1.05rem, 1.6vw, 1.6rem);
        line-height: 1.5;
        color: #f7f9ff;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .history-act {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .history-act + .history-act {
        margin-top: 10px;
        padding-top: 22px;
        border-top: 1px solid rgba(255, 255, 255, 0.24);
      }

      .history-act .history-entry:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .history-act-header {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .history-act-title {
        position: relative;
        padding-bottom: 6px;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #fff;
      }

      .history-act-title::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: var(--carpet-gradient);
      }

      .history-act-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .history-lock-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 16px;
        padding-top: 2px;
      }

      .history-lock-note {
        color: var(--muted);
        font-size: 0.85rem;
        font-style: italic;
      }

      .lock-history-button {
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: var(--carpet-gradient);
        color: #fff;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 9px 14px;
        cursor: pointer;
        transition: filter 0.12s ease, transform 0.12s ease;
      }

      .lock-history-button:hover {
        filter: brightness(1.15);
      }

      .lock-history-button:active {
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .confirm-overlay {
        z-index: 300;
        background: rgba(0, 0, 0, 0.72);
      }

      .confirm-card {
        position: relative;
        width: min(520px, 90vw);
        background: rgba(12, 13, 16, 0.97);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 28px 24px 22px;
        text-align: left;
      }

      .confirm-card::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        height: 3px;
        background: var(--carpet-gradient);
      }

      .confirm-title {
        margin: 0 0 12px;
        font-size: 1.3rem;
        letter-spacing: 0.04em;
        color: #fff;
      }

      .confirm-message {
        margin: 0;
        color: #dfe3ea;
        line-height: 1.55;
        white-space: pre-line;
      }

      .confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;

          { text: "Yes, the feather IS necessary.", origin: "feather pencil item description" },
          { text: "These walls will take quite a beating.", origin: "thulecite wall item description" },
          { text: "Spikes make everything better.", origin: "thulecite club item description" },
          { text: "It’s an empty shell of a man.", origin: "friendly scarecrow, DST" },
          { text: "A nightmarish cloak to keep the light at bay.", origin: "void robe item description" },
          { text: "Shadowy protection even from the harshest rainfall", origin: "umbralla item description" },
          { text: "Knock’em out cold!", origin: "flash freeze staff item description" },
          { text: "It pleases when broken into pieces.", origin: "portation orb fragment item description" },
          { text: "What a well dressed figure!", origin: "Maxwell examining kingly figure, DST" },
          { text: "What shall we destroy next, wielder?", origin: "level 2-3 shadow maul" },
          { text: "Mortal, do you realize what we are capable of together?", origin: "level 2-3 shadow maul" },
          { text: "Shall we murder something of consequence now?", origin: "level 2-3 shadow maul mob kill" },
          { text: "Yes. / All… m-mine.", origin: "shadow maul chopping level 1, Woodie wielder" },
          { text: "If I’m not killing, I’m dying!", origin: "shadow maul level 2-3, starving" },
          { text: "I’m rather insulted.", origin: "shadow maul level 3, mob kill" },
          { text: "I will save you.", origin: "Ancient Fuelweaver, player battlecry" },
          { text: "How long have I slumbered?", origin: "Ancient Fuelweaver, woven shadow summon" },
          { text: "Protect me.", origin: "Ancient Fuelweaver, unseen hands summon" },
          { text: "Metheus… / I must do this, for your sake.", origin: "Ancient Fuelweaver, gateway turned off" },
          { text: "I was wrong.", origin: "Ancient Fuelweaver, gateway turned off" },
          { text: "You’ve made your choice.", origin: "Ancient Fuelweaver, death cry" },
          { text: "You fools! What have you done?", origin: "Ancient Fuelweaver, player cry with gateway fixed" },
          { text: "I recognize your arrogance. I possessed it myself.", origin: "Ancient Fuelweaver, player cry with gateway fixed" },
          { text: "Your existence, a whisper- forgotten, frail-", origin: "Hallowed Nights 2024 comic" },
          { text: "You hear the echoes of laughter long past,", origin: "Hallowed Nights 2024 comic" },
          { text: "And even the lost will find light in the shade.", origin: "Hallowed Nights 2024 comic" },
          { text: "For come too close, your flame they would smother.", origin: "Hallowed Nights 2024 comic" },
          { text: "Say pal, would you be [mine]?", origin: "Maxwell 2016 valentine’s day card" },
          { text: "Such fools, such fools, you make me laugh,", origin: "Charlie, Hallowed Nights comic 2019" },
          { text: "Tough crowd.", origin: "Maxwell examining Mocking Birds, DST" },
          { text: "Was it wise to unleash this upon the world?", origin: "Maxwell examining Odd Skeleton, DST" },
          { text: "Quite uncouth.", origin: "Maxwell examining dragoon saliva, DS" },
          { text: "Hearts only bring pain anyway.", origin: "Maxwell examining dragoon heart, DS" },
          { text: "Exactly what it looks like. Err... What does it look like?", origin: "Maxwell examining sextant, DS" },
          { text: "It will hold off my vessel's inevitable decay.", origin: "Maxwell examining boat repair kit, DS" },
          { text: "Protects my most important part.", origin: "Maxwell examining pith hat, DS" },
          { text: "Someone will pay for that.", origin: "Maxwell examining burnt slanty shanty, DS" },
          { text: "Don't make me do something I'll regret.", origin: "Maxwell examining rabid pog, DS" },
          { text: "What a delightful color.", origin: "Maxwell examining obsidian, DS" },
          { text: "Hm. I don’t mind the new look.", origin: "Maxwell examining blighted rocky boss, DST" },
          { text: "It thinks it’s being clever.", origin: "Maxwell examining shielding rocky boss" },
          { text: "I don’t even want to know, Charlie.", origin: "Maxwell examining bat boss organ" },
          { text: "H-hey there, pal... Maxwell here. Big fan of, uh... whatever it is you're doing.", origin: "Maxwell examining Shrouden" },
          { text: "The ritual demands sacrifices.", origin: "Charlie monologue for sacrifices" },
          { text: "They whom we call Shrouden accept our sacrifices.", origin: "Charlie monologue for ritual start" },
          { text: "They are waiting…", origin: "Fuelweaver ally spawn monologue" },
          { text: "You have chosen… This innocent creature…", origin: "cut Fuelweaver ally boss corruption monologue" },
          { text: "What have I done?", origin: "Fuelweaver ally seeing atrium" },
          { text: "I’m sorry.", origin: "Fuelweaver ally seeing residential ruins" },
          { text: "How do you fight an enemy that has taken root in your very being?", origin: "Fuelweaver ally seeing military ruins" },
          { text: "Have you returned? Alas… not soon enough.", origin: "Fuelweaver ally seeing lunar grotto" },
          { text: "They trusted no one… especially me.", origin: "Fuelweaver ally seeing sanctum vault" },
          { text: "It promised… All lies…", origin: "Fuelweaver ally inspecting sanctum gateway" },
          { text: "I was blind… a fool.", origin: "Fuelweaver ally inspecting sanctum gateway" },
          { text: "Was I not worthy of your trust?", origin: "Fuelweaver ally inspecting elytra’s body" },
          { text: "How unbearable that weight must have been upon your soul… if it is still yours.", origin: "Fuelweaver ally inspecting elytra’s body" },
          { text: "So this is the cruel fate that befell my dear friend.", origin: "Fuelweaver ally inspecting artificer’s body" },
          { text: "It’s too late.", origin: "Fuelweaver ally inspecting sanctum rune stones" },
          { text: "Better one should fall than all.", origin: "Fuelweaver ally inspecting sequitor puzzle" },
          { text: "What words did she impart to you in those darkest of days?", origin: "Fuelweaver ally inspecting elytra mask" },
          { text: "Never one to temper the truth, nor spare a wounded heart.", origin: "Fuelweaver ally inspecting artificer mask" },
          { text: "So afraid of the dark…", origin: "Fuelweaver ally inspecting nightmare light" },
          { text: "But all who bathed in the glow… lost themselves to madness.", origin: "Fuelweaver ally inspecting nightmare light" },
          { text: "They followed me… into damnation.", origin: "Fuelweaver ally inspecting atrium obelisks" },
          { text: "Did you know we waited? Were we nothing to you?", origin: "Fuelweaver ally inspecting archive statues" },
          { text: "Faith alone could not sustain.", origin: "Fuelweaver ally inspecting archive runes" },
          { text: "We thought our knowledge gave us power over the forces we tampered with.", origin: "Fuelweaver ally inspecting fountain of knowledge" },
          { text: "My memory fails me.", origin: "Fuelweaver ally inspecting archive portal" },
          { text: "We should have known better… I should have known better.", origin: "Fuelweaver ally inspecting ruin statue" },
          { text: "Your lust for power consumes you.", origin: "Fuelweaver ally inspecting nightmare werepig" },
          { text: "Kept hidden … by my beloved.", origin: "fragments of Fuelweaver ally inspecting vault key" },
          { text: "Still, you fare better than I…", origin: "Fuelweaver ally inspecting Maxwell" },
          { text: "Ripped from my slumber.", origin: "Fuelweaver ally spawned a second time" },
          { text: "Is this my curse?", origin: "Fuelweaver ally spawned a second time" },
          { text: "Rise anew and bring glory.", origin: "cut Fuelweaver ally performing corruption" },
          { text: "Your sacrifice will not be forgotten.", origin: "Fuelweaver ally performing corruption" },
          { text: "Where is she?", origin: "Fuelweaver ally idle speech" },
          { text: "Why do you torment me?", origin: "Fuelweaver ally greeting speech" },
          { text: "Who are you to lead a king like a thrall?", origin: "Fuelweaver ally following thurible" },
          { text: "What choice have I but to walk at your command?", origin: "cut Fuelweaver ally following thurible" },
          { text: "I shall follow you to your doom.", origin: "Fuelweaver ally following thurible" },
          { text: "They trusted me. I failed them.", origin: "Fuelweaver ally idle for residential ruins" },
          { text: "It pains me to remember what we once were.", origin: "Fuelweaver ally idle for archives" },
          { text: "All I touch is laid to ruin!", origin: "Fuelweaver ally after destroying a structure" },
          { text: "By your choice, however cruel,", origin: "Fuelweaver ally corrupting for the first time" },
          { text: "The others see your might. I can see why you need it.", origin: "Fuelweaver ally greeting wolfgang player" },
          { text: "What you seek is unfathomable.", origin: "Fuelweaver ally greeting wickerbottom player" },
          { text: "To know it is to damn yourself.", origin: "Fuelweaver ally greeting wickerbottom player" },
          { text: "Abandon hope… Or join her…", origin: "Fuelweaver ally greeting winona player" },
          { text: "Soon enough, your glee shall turn to tears.", origin: "Fuelweaver ally greeting wortox player" },
          { text: "Tell my tale, so others may avoid the path of a faithless old king.", origin: "Fuelweaver ally greeting walter player" },
          { text: "How bravely you stood against the darkness while I was blinded by it, lost to it.", origin: "Fuelweaver NPC inspecting queen’s torch" },
          { text: "We just want to go home.", origin: "scrapbook text for umbral abomination" },
          { text: "An annoying little creep that just wants to be held by you.", origin: "scrapbook text for mimicreep" },
          { text: "Dense and unyielding, it will take great effort to crack its shell.", origin: "scrapbook text for mega blight" },
          { text: "A working heart that needs a new body.", origin: "scrapbook text for shadow atrium" },
          { text: "trades your own mind for power against them in more ways than one.", origin: "scrapbook text for rabbit king cudgel" },
          { text: "Betrayal begets the darkest of curses.", origin: "scrapbook text for artificer’s mask" },
          { text: "Charlie's version of events.", origin: "scrapbook text for the enchanted doll play" },
          { text: "Shady promotional material.", origin: "scrapbook text for the pall stage play" },
          { text: "only Metheus knows.", origin: "scrapbook text for ancient chest" },
          { text: "A gift graciously bestowed to you … to enrich your sad, futile little lives.", origin: "scrapbook text for stage" },
          { text: "She was even kind enough to prepare costumes and a script!", origin: "scrapbook text for stage" },
          { text: "Echoes of lost souls.", origin: "scrapbook text for grim harrier" },
          { text: "Don’t get too close.", origin: "scrapbook text for grim harrier" },
          { text: "Not too keen on the whole mouth thing.", origin: "Maxwell examine blighted hound batilisk figure" },
          { text: "Be careful not to overuse, or you will fall as they did.", origin: "scrapbook text for king’s staff" },
          { text: "I’m sorry, Charlie.", origin: "Maxwell examining queen’s mask" },
          { text: "Once worn by Her Royal Darkness.", origin: "scrapbook text for queen’s mask" },
        ],
        "ACT II": [
          { text: "Ow! Charlie, that hurt!", origin: "Maxwell announcing darkness attack, DS" },
          { text: "I'm so sorry Charlie.", origin: "Maxwell examining Codex Umbra, DS" },
          { text: "It'll be dark soon. Charlie will be waking up.", origin: "Maxwell’s dusk announce, DS" },
          { text: "It's no rose.", origin: "Maxwell examining exotic flower, DS" },
          { text: "Must everything be about my shortcomings?", origin: "Maxwell examining queenly figure, DST" },
          { text: "Are you prepared for what you'll find?", origin: "Maxwell examining rose-colored glasses, DST" },
          { text: "Always did have a flair for the dramatic...", origin: "Maxwell examining florid postern, DST" },
          { text: "Her tragedy does not define her.", origin: "Maxwell examining tragedy statue, DST" },
          { text: "Misdirection, the oldest trick in the book. Well played, Charlie.", origin: "Maxwell examining playbill, DST" },
          { text: "Ow! Be gentle, Charlie!", origin: "Maxwell announcing darkness attack, DST" },
          { text: "They're smaller than I remember... going soft on us, Charlie?", origin: "Maxwell examining varglet, DST" },
          { text: "I think that one will fit me nicely.", origin: "Maxwell examining king costume, DST" },
          { text: "Thank you very much, you are too kind.", origin: "line 1 of Maxwell’s soliloquy, DST" },
          { text: "I just need to find my beautiful assistant.", origin: "Maxwell’s quote for guest of honor set skin" },
          { text: "She really expects me to... oh why not.", origin: "Maxwell examining playbill, unimplemented/removed" },
          { text: "How different might things have been, / if I never sought the crown?", origin: "King’s soliloquy, lines 1/2" },
          { text: "I suppose the world would be a bit brighter.", origin: "King’s soliloquy, line 3" },
          { text: "Perhaps we could travel together? / This road is long, and can get quite lonely.", origin: "King in act 1 scene 3" },
          { text: "Not today little doll,", origin: "King in act 2 scene 1" },
          { text: "I'm afraid I can't, / there's a full moon out tonight!", origin: "King in act 2 scene 1" },
          { text: "No! My secret has been discovered!", origin: "King in act 2 scene 1" },
          { text: "My power? Never!", origin: "King in act 2 scene 3" },
          { text: "And so, / with the treacherous King gone and forgotten, / the little doll because a just and formidable Queen.", origin: "Narrator in act 3 scene 3" },
          { text: "A little light in the dark.", origin: "Maxwell examining tar lamp, DS" },
          { text: "I'll have to get my roses elsewhere.", origin: "Maxwell examining Hamlet farm store burning, DS" },
          { text: "Stop attacking my mind!", origin: "Maxwell examining Sisturn with dark petals, DST" },
          { text: "I never was one to shy away from theatrics, or a good suit.", origin: "Maxwell’s quote for Hallowed Nights set skin" },
          { text: "Hmph. I hope she appreciates this.", origin: "Maxwell examining Pearl's light post, DST" },
          { text: "She doesn't understand the full extent of the power she's toying with.", origin: "Maxwell examining time pieces, DST" },
          { text: "She looks a little bossy.", origin: "Maxwell examining princess mask, DST" },
          { text: "Someone thinks highly of themselves.", origin: "Maxwell reacting to other player with bee queen crown line 1" },
          { text: "Your “Majesty.”", origin: "Maxwell reacting to other player with bee queen crown line 2" },
          { text: "Some cracks can't be mended.", origin: "Maxwell examining broken shell, DST" },
          { text: "I had to try.", origin: "Maxwell failing Abigail revival, DST" },
          { text: "I feel protected by an unseen force.", origin: "Maxwell announcing garlic powder buff, DST" },
          { text: "If only the world had a single neck.", origin: "Maxwell examining razor, DS" },
          { text: "You'll still be in there when you wake up.", origin: "Maxwell examining bird in cage, asleep, DS" },
          { text: "I am filled with the irrational urge to stomp upon it.", origin: "Maxwell examining flower, DS" },
          { text: "I like that flower.", origin: "Maxwell examining evil flower, DS" },
          { text: "Where are their gods now?", origin: "Maxwell examining ancient pseudoscience station, DS" },
          { text: "Grey is the color of pain.", origin: "Maxwell examining azure feather, DS" },
          { text: "How pretty. / I could squish them if I wanted to.", origin: "Maxwell examining fireflies/held fireflies, DS" },
          { text: "Better her than me.", origin: "Maxwell examining female character on nightmare throne, DS" },
          { text: "I don't think she'd take kindly to that.", origin: "Maxwell announcing can't shave beefalo, DS" },
          { text: "It's not a question of if I will conquer it, but when.", origin: "Maxwell examining sea hound, DS" },
          { text: "You will bow to me.", origin: "Maxwell examining Quacken, DS" },
          { text: "Not something a gentleman handles without gloves.", origin: "Maxwell examining eye of the Tiger Shark, DS" },
          { text: "Which unfortunate soul was that?", origin: "Maxwell examining crime rug, DS" },
          { text: "Ah, metamorphosis...", origin: "Maxwell examining glowfly cocoon, DS" },
          { text: "Destructive. I like it.", origin: "Maxwell examining executive hammer, DS" },
          { text: "Every lovely flower must one day wilt.", origin: "Maxwell examining wilted flower in end table, DST" },
          { text: "If only life were that simple.", origin: "Maxwell examining empty frame, DST" },
          { text: "The magic beckons!", origin: "Maxwell examining active lazy deserter, DST" },
          { text: "Some things can be repaired.", origin: "Maxwell examining void repair kit, DST" },
          { text: "I'm picking up notes of terror, with a hint of dread.", origin: "Maxwell examining embalming spritz, DST" },
          { text: "Want to see a cool trick? I just need a volunteer...", origin: "Maxwell examining flash freeze staff, DST" },
          { text: "The show's over.", origin: "Maxwell examining burnt mighty gym, DST" },
          { text: "He's a soul sucker, that one.", origin: "Maxwell examining soul jar, DST" },
          { text: "Careful, madam. I know where this trail ultimately leads.", origin: "Maxwell examining ageless/second change/rift watch, DST" },
          { text: "How the tables have turned, worm.", origin: "Maxwell examining jelly worm, DST" },
          { text: "This animal commands respect through violence.", origin: "Maxwell examining catcoon figure, DST" },
          { text: "Care for a gentleman's duel?", origin: "Maxwell examining glove of challenge, DST" },
          { text: "Enjoying the show, pal?", origin: "Maxwell examining Broodling spectator, DST" },
          { text: "Make up your mind! Friend or foe?", origin: "Maxwell examining gilded knight figure, DST" },
          { text: "It reminds lesser players where the world ends.", origin: "Maxwell examining golf course wall, DST" },
          { text: "Must you always be in my way?", origin: "Maxwell examining golf obstacles, DST" },
          { text: "Hey, that's not a statue of me!", origin: "Maxwell examining Glommer’s statue, DS" },
          { text: "Hmph. Impressive sleight of hand.", origin: "Maxwell examining stagehand walking, DST" },
          { text: "Charlie... what are you planning?", origin: "Maxwell examining nightmare rampart, DST" },
          { text: "I'll leave a bitter taste in your mouth, pal.", origin: "Maxwell examining rasp, DST" },
          { text: "You've changed.", origin: "Maxwell examining possessed mob/possessed other player, DST" },
          { text: "It's happy with me, and I with it.", origin: "Maxwell examining extra-adorable lavae happy, DST" },
          { text: "You thought you could fool me?", origin: "Maxwell examining held carrat, DST" },
          { text: "Not the castle I had in mind for myself.", origin: "Maxwell examining glass castle, DST" },
          { text: "Say pal, why don't we talk this out?", origin: "Maxwell examining freed nightmare werepig, DST" },
          { text: "Old habits die hard... and so will you!", origin: "Maxwell announcing murderer Maxwell player, DST" },
          { text: "A complete and utter fraud...", origin: "Maxwell examining fake kazoo, DST" },
          { text: "Admittedly, it's difficult to maintain balance when you're on top.", origin: "Maxwell examining unbalanced top, DST" },
          { text: "Say pal, you don't look so good...", origin: "you already know where this is from" },
          { text: "I think it would be best to keep my distance.", origin: "Maxwell examining greater gestalt, DST" },
          { text: "Let's find a heart. I'll prepare my incantations.", origin: "Maxwell examining ghost Wolfgang player, DST" },
          { text: "Oh dear, whatever will become of your kingdom now?", origin: "Maxwell examining ghost wurt player, DST" },
          { text: "I do not wish to quarrel!", origin: "Maxwell announcing attacker walter player, DST" },
          { text: "Murderous fiend! I'll show you true power!", origin: "Maxwell announcing murderer Wanda player, DST" },
          { text: "I don't like sharing.", origin: "Maxwell announcing occupied craft station, DST" },
          { text: "I am attacked by my own world!", origin: "Maxwell announcing final sinkhole warning, DST" },
          { text: "You better pay up this week or there will be trouble! I will find you!", origin: "note to William from Witherstone, William Carter Puzzles" },
          { text: "All will be explained when we meet.", origin: "letter to Jack, William Carter Puzzles" },
          { text: "Must provide own costume.", origin: "Maxwell’s ad, William Carter Puzzles" },
          { text: "alucinatio / voces / tenebris / Charlie / Charlie / Charlie", origin: "Maxwell’s walls, William Carter Puzzles" },
          { text: "Max, where are you?", origin: "Charlie’s second letter, William Carter Puzzles" },
          { text: "When the muscle is stripped away all that remains is a sweet, delicate flower.", origin: "Wolfgang’s Roseate body skin description" },
          { text: "The leaves on this tunic never wilt nor die, but neither do they grow.", origin: "Maxwell’s Verdant body skin description" },
          { text: "Have you tried amputating what ails you?", origin: "Wilson’s Victorian body skin description" },
          { text: "Even a fool can pass for nobility in this ensemble.", origin: "Wes’s Moonbound body skin description" },
          { text: "Pugilism is a gentleman's sport.", origin: "Wolfgang’s Victorian skin description" },
          { text: "It would be wise not to get on the queen of winter's bad side.", origin: "Wickerbottom’s Snowfallen head skin description" },
          { text: "Now duel for the rose queen's amusement.", origin: "Wickerbottom’s Roseate head skin description" },
          { text: "The garb of a blood-sucking monster seems to suit him quite well.", origin: "Maxwell’s Vampiric head skin description" },
          { text: "This melancholic mystery man keeps slinking off to find dark corners to brood in.", origin: "Maxwell’s Masquerader head skin description" },
          { text: "Maxwell has sacrificed much at the altar of his own aspiration.", origin: "Maxwell’s Equinor head skin description" },
          { text: "This handsome devil is on another level... of reality.", origin: "Wortox’s Guest of Honor head skin description" },
          { text: "It isn't a fancy occasion if you're not wearing gloves.", origin: "Wanda’s Guest of Honor hand skin description" },
          { text: "Gloved hands tend the finest roses.", origin: "Warly’s Roseate hand skin description" },
          { text: "Glittery gold beads, procured through questionable means.", origin: "Wortox’s Swashbuckler hand skin description" },
          { text: "For some reason, nobody wants to hold your hand.", origin: "Webber’s Moonbound hand skin description" },
          { text: "Will you reach for the light or the darkness?", origin: "Maxwell’s Moonbound hand skin description" },
          { text: "As his boots crunch through the unsullied snow, he leaves behind the only evidence of his passing; a trail of steady, methodical footprints.", origin: "Woodie’s Merrymaker leg skin description" },
          { text: "A storyteller must always stay two steps ahead of their audience.", origin: "Walter’s Hallowed Nights feet skin description" },
          { text: "The monochromatic stripes go well with any grey areas you might find yourself in.", origin: "Maxwell’s Moonbound feet skin description" },
          { text: "Tread as you will upon hallowed ground.", origin: "WX’s ancient feet skin description" },
          { text: "Protect yourself with the fanciest old bones.", origin: "Ornate Bone Armor skin description" },
          { text: "Become the most dreaded warrior on the battlefield.", origin: "Horned Dreadstone Armor skin description" },
          { text: "Sometimes you gotta lose it, to find it.", origin: "Sepulchral/Qualming Amulet skin description" },
          { text: "You'll get what's coming to you.", origin: "Reaping Amulet skin description" },
          { text: "BEWARE OF DOG.", origin: "Warhound Helm skin description" },
          { text: "These beautiful blooms have had to fight for survival in the unforgiving wilderness.", origin: "Wildflower Helm skin description" },
          { text: "Alas, we may never know what wondrous creature this wing might have once belonged to.", origin: "Fantastical Bat skin description" },
          { text: "Beauty can be found everywhere, even in blunt force.", origin: "Nouveau Club skin description" },
          { text: "It's full of warm, fuzzy, stinging, and angry feelings.", origin: "Will You Bee Mine? skin description" },
          { text: "Always fight fire with fire.", origin: "Flamelash skin description" },
          { text: "Just the thing to help bury those pesky feelings.", origin: "Heart Spade skin description" },
          { text: "Rekindle an old flame.", origin: "Vintage Lighter skin description" },
          { text: "A dread instrument for self-surgery.", origin: "Crimson-forged Extractor skin description" },
          { text: "To tread ancient paths, long forgotten.", origin: "Ancient Cane skin description" },
          { text: "Will their hot-and-cold forbidden romance last?", origin: "part of the Mermio and Pigliet skin description" },
          { text: "Alas, some daggers through the heart are more literal than others.", origin: "Daggered Heart skin description" },
          { text: "A wispy haven for your daydreams.", origin: "Luxurious Lean-to skin description" },
          { text: "Love the new look.", origin: "Lover’s Wardrobe skin description" },
          { text: "Almost scarier than just being in the dark.", origin: "Ornate Night Light skin description" },
          { text: "You have the most unnerving feeling that you're being watched.", origin: "Ancient Sigil skin description" },
          { text: "Maybe a pretty cage will help the bird come to terms with its imprisonment. Probably not though.", origin: "Baroque Birdcage skin description" },
          { text: "Some like it hot, some like it even hotter.", origin: "Lava Firepit skin description" },
          { text: "Despite the heat it provides, you can't help but feel a chill run down your spine.", origin: "Foreboding Furnace skin description" },
          { text: "Behold, the power of beauty!", origin: "Genteel Generator skin description" },
          { text: "Careful not to get too comfortable.", origin: "Parlor Wooden stool" },
          { text: "There's a place at this table for everyone... of a certain status.", origin: "Wrought Iron/Antique Table skin description" },
          { text: "A single rose for simplistic beauty.", origin: "A Singular Vase skin description" },
          { text: "It was no fairy tale ending.", origin: "The Fall skin description" },
          { text: "Decorate with the Shadow Queen's favorite flower.", origin: "Rose Bushel skin description" },
          { text: "Bad luck. Good luck. Either way it's still adorable.", origin: "Black Kittykit skin description" },
          { text: "Death is just a setback.", origin: "the Persister Abigail skin description" },
          { text: "Life is so fragile, like a butterfly's wings.", origin: "the Verdant Abigail skin description" },
          { text: "This flower is always watching.", origin: "Lureplant costume Abigail skin description" },
          { text: "Feel like confronting the void? Just look into his eyes!", origin: "Hollow Gaze Hutch skin description" },
          { text: "It waits, watching for weakness.", origin: "Ominous Exploiterator skin description" },
          { text: "What an inviting passageway, I'll bet it isn't even cursed!", origin: "Fairy Ring skin description" },
          { text: "It's inviting you in with a big toothy grin!", origin: "Snaggletooth Wormhole skin description" },
          { text: "There's remerkable beauty within the terrifying depths of the sea.", origin: "Shellbound portrait frame description" },
          { text: "An empty shrine needs a sacrifice.", origin: "Empty Pig Shrine portrait frame description" },
          { text: "The hunt is on!", origin: "Year of the Varg portrait frame description" },
          { text: "Knowledge can consume the mind to feed the soul. / And consume the soul to feed the mind.", origin: "Mad Scientist Wilson vignette description" },
          { text: "It can be hard to look to the future when your heart remains in the past.", origin: "Glory Days vignette description" },
          { text: "“Don't be silly, it's just a bad dream…”", origin: "The Nightmare vignette description" },
          { text: "Freeing him might not have been my best idea.", origin: "Nightmare Werepig vignette description" },
          { text: "Could there be light at the end of the tunnel?", origin: "What Lies Ahead vignette description" },
          { text: "Maxwell grew quite accustomed to a world that followed his rules...", origin: "part of The Puppetmaster vignette description" },
          { text: "Few things can set the Queen of the Constant herself on edge…", origin: "Rumblings Above vignette description" },
          { text: "Maxwell now finds himself surviving alongside the very people he once tormented.", origin: "lore tips" },
          { text: "Blast this heat! Where's a nice, chilled drink when you need it?", origin: "Maxwell’s survival tip" },
          { text: "They say the Shadow Queen herself comes at night to snatch up anyone foolish enough to wander in the dark…", origin: "survival tip" },
          { text: "It’s been a while, old friend ♡", origin: "Encore, animated short" },
          { text: "LET ME IN", origin: "Encore, animated short" },
          { text: "Ready for an Encore? ♡", origin: "Encore, animated short" },
          { text: "A pause for reflection ignited… affection?", origin: "Tales From The Constant: Falling animated short" },
          { text: "The two species collide", origin: "Tales From The Constant: Falling, animated short" },
          { text: "This moment of respite revealed two fateful facts / The two were together and there was no going back.", origin: "Tales From The Constant: Falling, animated short" },
          { text: "The dark knowledge within addled his mind and clouded his heart.", origin: "DST compendium entry" },
          { text: "Let’s make a deal. You can stay here. Settle down, even.", origin: "Maxwell, chapter 3-4 Adventure Mode" },
          { text: "Impressive. But you should probably stop while you’re ahead.", origin: "Maxwell, chapter 3 non-Two Worlds Adventure Mode" },
          { text: "Do not arouse the wrath of the Great Maxwell!", origin: "Maxwell, chapter 5 Adventure Mode" },
          { text: "Let’s see what you’re really made of.", origin: "Maxwell, unused Adventure Mode lines" },
          { text: "I will enjoy inspecting your entrails once the Deerclops is done with you.", origin: "Maxwell, unused Adventure Mode lines" },
          { text: "HOUNDS! DISPOSE OF THIS PEST!", origin: "Maxwell, unused Adventure Mode lines" },
          { text: "Is this how it ends?", origin: "Maxwells final speech, Adventure Mode" },
          { text: "I’ve learned so much since then. I’ve built so much.", origin: "Maxwells final speech, Adventure Mode" },
          { text: "You can’t change the rules of the game.", origin: "Maxwells final speech, Adventure Mode" },
          { text: "Go on, stay a while. Keep us company.", origin: "Maxwells final speech, Adventure Mode" },
          { text: "I think I’ve said enough.", origin: "Maxwells final speech, Adventure Mode" },
          { text: "Don’t you think I’ve tried that?", origin: "Maxwell, chapter 5 Adventure Mode" },
          { text: "Reality is like that, sometimes.", origin: "Maxwell, chapter 5 Adventure Mode" },
          { text: "Say pal, keep your chin up. / You will probably find it hard to stay dapper.", origin: "Maxwell, unimplemented/beta Adventure Mode intro lines" },
          { text: "I left you a little something… I don’t think it will help you though.", origin: "Maxwell, unimplemented/beta Adventure Mode intro lines" },
          { text: "Where would be the sport in that?", origin: "Maxwell, unimplemented/beta Adventure Mode lines" },
          { text: "So don your chilling costumes / and steel your heart for season’s fright", origin: "Maxwell’s story, 2016 Hallowed Nights comic" },
          { text: "Fingers born of darkest pitch / And claws of blackest shade / Grasped tightly ‘round their ankles / And of them a puppet made,", origin: "Maxwell’s story, 2017 Hallowed Nights comic" },
          { text: "My dears, my dears, why do you stay / Bathed in that vulgar light?", origin: "Charlie’s story, 2019 Hallowed Nights comic" },
          { text: "My friends, my friends, you look so pale / No need to be afraid.", origin: "Charlie’s story, 2019 Hallowed Nights comic" },
          { text: "But I have learned since then that light / Does not survive this place.", origin: "Charlie’s story, 2019 Hallowed Nights comic" },
          { text: "This was your fault…", origin: "Charlie speech file" },
          { text: "Your hubris… Maxy… it was always your weakness…", origin: "Charlie speech file" },
          { text: "… I’m so sorry, I never meant for you to come here.", origin: "Charlie speech file" },
          { text: "… I suppose I’ll have to make do.", origin: "Charlie speech file" },
          { text: "Maxwell will miss you!", origin: "DS exit verification popup" },
          { text: "Sorry we can’t make it.", origin: "Charlie’s letter, Forgone short" },
          { text: "We have our biggest show coming up.", origin: "Charlie’s letter, Forgone short" },
          { text: "In this place where lines were drawn long ago, life can be short, terrifying and chaotic, but sometimes there comes a moment that makes it worth it.", origin: "Klei description for Tales From The Constant: Falling short" },
          { text: "lovely roses", origin: "world generation sentence fragment" },
          { text: "terrible darkness", origin: "world generation sentence fragment" },
          { text: "an inescapable nostalgia", origin: "world generation sentence fragment" },
          { text: "gold and marble", origin: "world generation sentence fragment" },
          { text: "common goals", origin: "world generation sentence fragment" },
          { text: "a hint of shadow", origin: "world generation sentence fragment" },
          { text: "a keen sense of despair", origin: "world generation sentence fragment" },
          { text: "royalty", origin: "world generation sentence fragment" },
          { text: "solving", origin: "world generation sentence fragment" },
          { text: "game theory", origin: "world generation sentence fragment" },
          { text: "Amplify the magical power of your top hat.", origin: "prestihatitator item description" },
          { text: "Protects you from death.", origin: "life giving amulet item description" },
          { text: "Freeze enemies in their tracks.", origin: "ice staff item description" },
          { text: "Make the world weep.", origin: "dripple pipes item description" },
          { text: "Surround yourself in the most dreadful décor.", origin: "dreadstone wall item description" },
          { text: "Super super soft.", origin: "lush carpet item description" },
          { text: "Sit back, relax, and listen to the soundtrack of your nightmares.", origin: "gramophone item description" },
          { text: "Create horrors for your convenience.", origin: "shadowcraft plinth kit item description" },
          { text: "Ethereal bodyguard.", origin: "DS-era shadow duelist item description" },
          { text: "The power of darkness holds up well under pressure.", origin: "dreadstone pillar item description" },
          { text: "Grab the reins and reign over the battlefield", origin: "nightmare saddle item description" },
          { text: "A chesspiece with a checkered past.", origin: "bishop figure item description" },
          { text: "The most powerful piece on the board.", origin: "queenly figure item description" },
          { text: "I reflect on our path of destruction with fondness.", origin: "level 3 shadow maul" },
          { text: "I fell for you.", origin: "level 2-3 shadow maul, Woodie wielder" },
          { text: "I crave beast flesh!", origin: "level 2-3 shadow maul, hungry" },
          { text: "You dare neglect me, mortal?", origin: "level 3 shadow maul, hungry" },
          { text: "Never let me go.", origin: "shadow maul chopping level 3, Woodie wielder" },
          { text: "Are you trying to kill me, wretched mortal?", origin: "shadow maul level 2-3, starving" },
          { text: "I’m proud of us.", origin: "shadow maul level 3, boss kill" },
          { text: "Writhing reinforcements", origin: "fragment of dreaded mudslinger item description" },
          { text: "You cannot win.", origin: "Ancient Fuelweaver, unseen hands summon" },
          { text: "Lend me your power, one last time.", origin: "Ancient Fuelweaver, unseen hands summon" },
          { text: "You cannot hurt me.", origin: "Ancient Fuelweaver, unseen hands summon" },
          { text: "Are you so easily deceived? Ha…", origin: "Ancient Fuelweaver, death cry" },
          { text: "you deserve this.", origin: "Ancient Fuelweaver, death cry" },
          { text: "I tried to stop it… It seems I learned nothing…", origin: "Ancient Fuelweaver, battle cry with gateway fixed" },
          { text: "Please. Let me save you from what is coming.", origin: "Ancient Fuelweaver, player cry with gateway fixed" },
          { text: "They will not show mercy as I have.", origin: "Ancient Fuelweaver, death cry with gateway fixed" },
          { text: "The darkness depends, Draped with despair,", origin: "Hallowed Nights 2024 comic" },
          { text: "Fighting sleep, chasing moments that couldn’t last.", origin: "Hallowed Nights 2024 comic" },
          { text: "If only for a night, to feel that warmth once more,", origin: "Hallowed Nights 2024 comic" },
          { text: "Though they smile, it’s a mask they wear to hide, / To obscure the darkness that festers inside.", origin: "Hallowed Nights 2024 comic" },
          { text: "Nothing could overshadow our love.", origin: "Maxwell 2018 valentine’s day card" },
          { text: "Ever hunger grows relentless,", origin: "Charlie, Hallowed Nights comic 2016" },
          { text: "When double-cross and foul play, / become so very “every day”", origin: "Hallowed Nights comic 2018" },
          { text: "I found that wholly unenjoyable. I swear.", origin: "Maxwell examining sandcastle, DS" },
          { text: "Ah, I do enjoy the finer things.", origin: "Maxwell examining lobster bisque, DS" },
          { text: "I am consumed by the abyss!", origin: "Maxwell announcing map border crossing, DS" },
          { text: "There's no need for such an outburst.", origin: "Maxwell announcing volcano eruption, DS" },
          { text: "\"It's working its way down.\"", origin: "Maxwell examining sinking trawl net, DS" },
          { text: "I won't be using it any longer.", origin: "Maxwell examining burnt meat effigy, DS" },
          { text: "That was simply undignified.", origin: "Maxwell examining picked dung pile, DS" },
          { text: "Does this entertain you, beast?", origin: "Maxwell announcing antlion tribute, DST" },
          { text: "I hope this makes you happy, Charlie.", origin: "Maxwell examining Charlie NPC scene 2" },
          { text: "Something horrid in there, no doubt.", origin: "Maxwell examining generic big bat cave" },
          { text: "Better be worth it…", origin: "Maxwell examining rocky boss organ" },
          { text: "Disgusting. Really, Charlie?", origin: "Maxwell examining worm boss organ" },
          { text: "Ow! What have you done with Charlie!?", origin: "Maxwell announcing darkness attack after shadow finale" },
          { text: "Seek them out. Allow them to be touched by Shadow…", origin: "Charlie monologue for sacrifices" },
          { text: "No! They’re the sacrifice, not me!", origin: "Charlie monologue for ritual start" },
          { text: "You…! What have you done?!", origin: "Fuelweaver ally spawn monologue" },
          { text: "As you wish… It is done.", origin: "cut Fuelweaver ally boss corruption monologue" },
          { text: "I have desecrated these sacred grounds.", origin: "Fuelweaver ally seeing sacred ruins" },
          { text: "I can’t bear the sight of it.", origin: "Fuelweaver ally seeing sacred ruins" },
          { text: "We lived in the light once.", origin: "Fuelweaver ally seeing archives" },
          { text: "This is all that remains.", origin: "Fuelweaver ally seeing archives" },
          { text: "How long as it been… What have I become?", origin: "Fuelweaver ally inspecting self statue" },
          { text: "Fools fated to repeat the same mistakes.", origin: "Fuelweaver ally inspecting sanctum guard statues" },
          { text: "How unbearable that weight must have been upon your soul…", origin: "Fuelweaver ally inspecting elytra’s body" },
          { text: "Poison? Did you know what it held? Did you choose it?", origin: "Fuelweaver ally inspecting visionist’s body" },
          { text: "This world is no longer our own.", origin: "Fuelweaver ally inspecting visionist’s body" },
          { text: "Yet you escaped… damning yourself.", origin: "Fuelweaver ally inspecting sanctum rune stones" },
          { text: "I’ve seen the way and it is cursed.", origin: "Fuelweaver ally inspecting flummoxing flame puzzle" },
          { text: "Your devotion to my beloved shall never be forgotten.", origin: "Fuelweaver ally inspecting elytra mask" },
          { text: "My heart aches at the fate of your glorious design.", origin: "Fuelweaver ally inspecting visionist mask" },
          { text: "You left us little choice.", origin: "Fuelweaver ally inspecting nightmare ramparts" },
          { text: "Was our devotion so lacking?", origin: "Fuelweaver ally inspecting nightmare ramparts" },
          { text: "I chose our path.", origin: "Fuelweaver ally inspecting atrium obelisks" },
          { text: "Do you know what we sacrificed?", origin: "Fuelweaver ally inspecting atrium rubble" },
          { text: "Cursed shade. Inevitable that it should inherit this world.", origin: "Fuelweaver ally inspecting resting horror" },
          { text: "The dark cannot be harnessed… or controlled.", origin: "Fuelweaver ally inspecting ancient pseudoscience station" },
          { text: "How long did you expect us to wait?", origin: "Fuelweaver ally inspecting archive runes" },
          { text: "It’s been an eternity.", origin: "Fuelweaver ally inspecting archive portal" },
          { text: "A blessing you can’t see our world in ruin.", origin: "Fuelweaver ally inspecting ruin statue" },
          { text: "May you never escape your bondage.", origin: "Fuelweaver ally inspecting nightmare werepig" },
          { text: "Your world is infected.", origin: "Fuelweaver ally inspecting shadow rift" },
          { text: "Unimaginable power, once at your fingertips.", origin: "Fuelweaver ally inspecting Maxwell" },
          { text: "I arise yet again.", origin: "Fuelweaver ally spawned a second time" },
          { text: "No more… I beg of you.", origin: "Fuelweaver ally spawned a second time" },
          { text: "We are all pawns.", origin: "Fuelweaver ally performing corruption" },
          { text: "Where is she? My love…", origin: "Fuelweaver ally idle speech" },
          { text: "It is a nightmare eternal.", origin: "Fuelweaver ally idle speech" },
          { text: "Have you seen her?", origin: "Fuelweaver ally greeting speech" },
          { text: "Do you know who I am?", origin: "Fuelweaver ally greeting speech" },
          { text: "I shall follow… every forced step steeped in shame… and loathing.", origin: "Fuelweaver ally following thurible" },
          { text: "Are you lost? For I am.", origin: "Fuelweaver ally following thurible" },
          { text: "All that was once sacred now stand defiled.", origin: "Fuelweaver ally idle for sacred ruins" },
          { text: "You should have never come here.", origin: "Fuelweaver ally idle for sanctum" },
          { text: "My way is ever cursed!", origin: "Fuelweaver ally after destroying a structure" },
          { text: "Know that I would extinguish you, given a thrall’s chance.", origin: "Fuelweaver ally encountering player" },
          { text: "Against my will, I was made to rise… so too shall you.", origin: "Fuelweaver ally corrupting" },
          { text: "One on either side of the grave.", origin: "Fuelweaver ally greeting wendy player" },
          { text: "She is lost to you… Like Metheus is to me…", origin: "Fuelweaver ally greeting winona player" },
          { text: "Or join her… Cursed to wander… Forever.", origin: "Fuelweaver ally greeting winona player" },
          { text: "This is old magic.", origin: "Maxwell examining queen’s torch item" },
          { text: "All that power and look where it got you.", origin: "Maxwell examining king’s staff item" },
          { text: "The rod that led those who trusted me to ruin.", origin: "Fuelweaver NPC inspecting king’s staff" },
          { text: "I was blinded by it, lost to it.", origin: "Fuelweaver NPC inspecting queen’s torch" },
          { text: "Stomp it out quickly, before it does more creeping.", origin: "scrapbook text for mimicreep" },
          { text: "It lurks in the shadows…", origin: "scrapbook text for rictus" },
          { text: "Wearing this will drive you instantly insane", origin: "scrapbook text for bone helm" },
          { text: "not attractive to parasites.", origin: "scrapbook text for embalming spritz" },
          { text: "She did what was necessary in service of her Queen.", origin: "scrapbook text for elytra’s mask" },
          { text: "The fossilized skeleton of a strange beast.", origin: "scrapbook text for odd skeleton" },
          { text: "Keep your gaze on the floor if you feel dizzy or disoriented.", origin: "scrapbook text for sanctum waymark" },
          { text: "The flame is calming. If only it would stay lit.", origin: "scrapbook text for flummoxing flame" },
          { text: "Enter and re-enter the amazing Constant again and again", origin: "scrapbook text for florid postern" },
          { text: "Chases those who dare still bask in the light.", origin: "scrapbook text for swarming horror" },
          { text: "It pleases when broken into pieces.", origin: "scrapbook text for portation orb fragment" },
          { text: "It was impressive, I’ll admit.", origin: "Maxwell examine blighted gread depths worm figure" },
          { text: "Where are you, Charlie?", origin: "Maxwell examine shrouded queen figure" },
          { text: "I don’t see what all the fuss was about.", origin: "Maxwell examine umbral abomination figure" },
          { text: "Gone… all gone.", origin: "Fuelweaver NPC seeing atrium a second time" },
          { text: "An age of brilliance.", origin: "Fuelweaver ally seeing archives" },
        ],
        "ACT III": [
          { text: "I've a habit of destroying beautiful things, haven't I?", origin: "Maxwell examining petals, DS" },
          { text: "That will keep Charlie away for now.", origin: "Maxwell examining high fire, DS" },
          { text: "Every breastpocket needs a fresh rose.", origin: "Maxwell examining the Hamlet farm store, DS" },
          { text: "I prefer roses.", origin: "Maxwell examining orchid plantholder, DS" },
          { text: "Charlie always complained about being cold. Sigh.", origin: "Maxwell examining fire nettle tea, DST" },
          { text: "This is wrong.", origin: "Maxwell examining rose, DST" },
          { text: "She's still in there somewhere. I know it.", origin: "Maxwell examining comedy statue, DST" },
          { text: "Just like the old days.", origin: "Maxwell examining stage, DST" },
          { text: "I suppose it's best to keep up appearances...", origin: "Maxwell announcing darkness approach, DST" },
          { text: "Curious. It smells like roses.", origin: "Maxwell examining shadow thurible, DST" },
          { text: "How very dramatic.", origin: "Maxwell examining non-king play masks, DST" },
          { text: "It seems silly now...", origin: "Maxwell examining Maxwell statue, DST" },
          { text: "The show was better with... well, it was better before.", origin: "line 3 of Maxwell’s soliloquy, DST" },
          { text: "I wonder how much she really remembers.", origin: "Maxwell watching act 2 scene 1, DST" },
          { text: "The thorned rose cannot help but prick. It is its nature.", origin: "Maxwell’s quote for roseate set skin" },
          { text: "Why, it's magic, my dear!", origin: "King in act 1 scene 3 " },
          { text: "I would be delighted.", origin: "King in act 1 scene 3" },
          { text: "Dear me, I couldn't possibly!", origin: "King in act 2 scene 1" },
          { text: "Darkness is never far from my mind.", origin: "Maxwell examining dreadstone helmet, DST" },
          { text: "Leave me be, monster! I-I'm just a poor, frail old man!", origin: "King in act 2 scene 3" },
          { text: "Little doll? It can't be! I... that is, you...", origin: "King in act 2 scene 3" },
          { text: "It seems that the years / had not been kind to the King,", origin: "Narrator in act 3 scene 2" },
          { text: "That smell... both nostalgic and terrifying!", origin: "Maxwell announcing darkness warn, DST" },
          { text: "It's dark! I can't see!", origin: "Maxwell announcing entering darkness, DS" },
          { text: "I prefer blooms of a darker shade.", origin: "Maxwell examining lotus flower, DS" },
          { text: "Here we go again. Dark magics are returning. The power's growing.", origin: "Maxwell examining Atrium destabilization, DST" },
          { text: "If only I stuck with these.", origin: "Maxwell examining deck of cards, DST" },
          { text: "Does she really need a statue?", origin: "Maxwell examining Bee Queen figure, DST" },
          { text: "I hope she stays dead.", origin: "Maxwell examining spider queen corpse, DST" },
          { text: "its beauty has been snuffed out forever.", origin: "Maxwell examining dead peagawk, DS" },
          { text: "Your “Royal Highness.”", origin: "Maxwell reacting to other player with bee queen crown line 3" },
          { text: "She's ignoring me... the nerve!", origin: "Maxwell announcing failed moon quay queen offering, DST" },
          { text: "Let me know your wishes, and I will oblige.", origin: "Maxwell examining celestial altar idol, DST" },
          { text: "Say, pal, I don't look so good...", origin: "Maxwell despawning at celestial portal, DST" },
          { text: "It's more pretty than dapper.", origin: "Maxwell examining pretty parasol, DS" },
          { text: "All things are doomed in time.", origin: "Maxwell examining burnt sunken boat, DS" },
          { text: "Don't think you'll be able to escape that easily.", origin: "Maxwell examining Webber's skull, DS" },
          { text: "The heart of the city is still.", origin: "Maxwell examining thulecite medallion min state, DS" },
          { text: "There's a story behind that...", origin: "Maxwell examining touch stone, DS" },
          { text: "It's almost like he's still alive.", origin: "Maxwell examining ancient guardian chest, DS" },
          { text: "Maybe I'll just get out of her way.", origin: "Maxwell examining spider queen, DS" },
          { text: "I'm sorry I had to do that, old friend.", origin: "Maxwell examining guardian's horn, DS" },
          { text: "I still look dapper, right? As if I need to check.", origin: "Maxwell’s unimplemented self inspect, DS" },
          { text: "Beautiful on the outside, destructive on the inside.", origin: "Maxwell examining howling conch, DS" },
          { text: "We are all trapped, in one way or another.", origin: "Maxwell examining Woodlegs' cage, DS" },
          { text: "I like it better dead.", origin: "Maxwell examining dead jellyfish, DS" },
          { text: "My vessel is sustaining damage.", origin: "Maxwell announcing boat durability loss, DS" },
          { text: "I hope you are ready.", origin: "Maxwell’s removed seaworthy quote, DS" },
          { text: "I was meant to be king.", origin: "Maxwell examining royal crown, DS" },
          { text: "I AM SUPERIOR!", origin: "Maxwell announcing living artifact put on, DS" },
          { text: "With my luck it'll lead me to my doom.", origin: "Maxwell examining waymark compass leading, DST" },
          { text: "Good. You sit. Forever.", origin: "Maxwell examining occupied chair, DST" },
          { text: "Presto change-o! Ahem... old habit.", origin: "Maxwell examining clean sweeper, DST" },
          { text: "Just like old times.", origin: "Maxwell examining Broodling, DST" },
          { text: "It makes me a little nostalgic.", origin: "Maxwell examining held inactive bernie, DST" },
          { text: "History repeats itself.", origin: "Maxwell examining burnt bookcase, DST" },
          { text: "I haven't had a real sleep in... ages.", origin: "Maxwell examining Sleepytime Stories, DST" },
          { text: "You are all ants in my eyes already.", origin: "Maxwell examining binoculars, DST" },
          { text: "Takes away the horrors. But who would want that?", origin: "Maxwell examining fear reducing potion, DST" },
          { text: "Fine! Begone! The Great Maxwell doesn't need help for a simple child's game.", origin: "Maxwell announcing ticoon abandonment, DST" },
          { text: "You were not clever enough to best the great Maxwell!", origin: "Maxwell’s found kitcoon announcement, DST" },
          { text: "A rose huh?", origin: "Maxwell examining gilded knight's chest plate, DST" },
          { text: "I would never stoop to such things.", origin: "Maxwell examining pith pike, DST" },
          { text: "Allow me to assist. / No need to thank me.", origin: "Maxwell announcing started/finished revival, DST" },
          { text: "So small and obedient. It goes where I direct it.", origin: "Maxwell examining golf ball, DST" },
          { text: "Everyone's got problems, pal. / Just what do you have to be upset about?", origin: "Maxwell examining stressed/very stressed plant, DST" },
          { text: "Thank goodness, I thought it was another wretched statue of me.", origin: "Maxwell examining Glommer's statue, DST" },
          { text: "The fewer statues the better, I say.", origin: "Maxwell examining mined Glommer's statue, DST" },
          { text: "Adapt or perish.", origin: "Maxwell examining sea bones, DST" },
          { text: "May you never wake.", origin: "Maxwell examining permafrost pengull asleep, DST" },
