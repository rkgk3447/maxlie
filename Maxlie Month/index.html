        "Skin Descriptions": [
          { text: 'I never was one to shy away from theatrics, or a good suit.', origin: 'Maxwell\'s quote for Hallowed Nights set skin' },
          { text: 'The poor unsuspecting fool has no idea what\'s coming.', origin: 'Maxwell\'s quote for the Untriumphant set skin' },
          { text: 'I just need to find my beautiful assistant.', origin: 'Maxwell\'s quote for guest of honor set skin' },
          { text: 'The thorned rose cannot help but prick. It is its nature.', origin: 'Maxwell\'s quote for roseate set skin' },
          { text: 'The delightful aroma of mothballs and decay wafts off it.', origin: 'Maxwell\'s Guest of Honor body skin description' },
          { text: 'A tragic end to a once-dapper three piece suit.', origin: 'Maxwell\'s Survivor body skin description' },
          { text: 'This look hearkens back to a simpler time. You are missed, Charlie.', origin: 'Maxwell\'s Untriumphant body skin description' },
          { text: 'People should know better than to grow too close to you.', origin: 'Maxwell\'s Roseate body skin description' },
          { text: 'When the muscle is stripped away all that remains is a sweet, delicate flower.', origin: 'Wolfgang\'s Roseate body skin description' },
          { text: 'Wild roses don\'t claim hillsides by being delicate.', origin: 'Winona\'s Roseate body skin description' },
          { text: 'An elegant dress to wear while keeping the common folk at arm\'s length.', origin: 'Wickerbottom\'s Snowfallen body skin description' },
          { text: 'The leaves on this tunic never wilt nor die, but neither do they grow.', origin: 'Maxwell\'s Verdant body skin description' },
          { text: 'Have you tried amputating what ails you?', origin: 'Wilson\'s Victorian body skin description' }, 
          { text: 'A gentleman\'s overcoat embellished with fine, rare furs.', origin: 'Woodie\'s Victorian body skin description' },
          { text: 'The perfect outfit for lounging in the drawing room, or putting the upper crust in their place.', origin: 'Wickerbottom\'s Victorian body skin description' },
          { text: 'Reminiscent of another world, another time…', origin: 'Wurt\'s Victorian body skin description' },
          { text: 'Even a fool can pass for nobility in this ensemble.', origin: 'Wes\'s Moonbound body skin description' },
          { text: 'Never sit at the table without an ace up each sleeve.', origin: 'Maxwell\'s Stampeder body skin description' },
          { text: 'Cold. Lifeless. Perfect.', origin: 'WX\'s Moonbound head skin description' },
          { text: 'Pugilism is a gentleman\'s sport.', origin: 'Wolfgang\'s Victorian skin description' },
          { text: 'This once-sweet doll was abandoned by her child and has since become a vessel of bitterness and resentment.', origin: 'Willow\'s Forlorn Doll head skin description' },
          { text: 'It would be wise not to get on the queen of winter\'s bad side.', origin: 'Wickerbottom\'s Snowfallen head skin description' },
          { text: 'Now duel for the rose queen\'s amusement.', origin: 'Wickerbottom\'s Roseate head skin description' },
          { text: 'A refined gentleman, or a wolf in sheep\'s clothing?', origin: 'Woodie\'s Masquerader head skin description' },
          { text: 'A hopelessly romantic clown.', origin: 'Wes\'s Pierrot head skin description' },
          { text: 'Before it all went so wrong…', origin: 'Maxwell\'s Untriumphant head skin description' },
          { text: 'Ladies and gentlemen, a round of applause for our lovely assistant.', origin: 'Maxwell\'s Roseate head skin description' },
          { text: 'The garb of a blood-sucking monster seems to suit him quite well.', origin: 'Maxwell\'s Vampiric head skin description' },
          { text: 'Maxwell\'s rage has split him in two.', origin: 'Maxwell\'s Magmatic head skin description' },
          { text: 'Some hearts never thaw.', origin: 'Maxwell\'s Merrymaker head skin description' },
          { text: 'Power really changes some people.', origin: 'Maxwell\'s Moonbound head skin description' },
          { text: 'This melancholic mystery man keeps slinking off to find dark corners to brood in.', origin: 'Maxwell\'s Masquerader head skin description' },
          { text: 'Maxwell has sacrificed much at the altar of his own aspiration.', origin: 'Maxwell\'s Equinor head skin description' },
          { text: 'Maxwell makes his own rules.', origin: 'Maxwell\'s Stampeder head skin description' },
          { text: 'Go to the dark side and be on top of the world.', origin: 'Wigfrid\'s Triumphant head skin description' },
          { text: 'The rosebuds are tangled in there real good.', origin: 'Webber\'s Roseate head skin description' },
          { text: 'This handsome devil is on another level... of reality.', origin: 'Wortox\'s Guest of Honor head skin description' },
          { text: 'Sometimes the last to bloom is the most beautiful flower.', origin: 'Wormwood\'s Roseate head skin description' },
          { text: 'Why fight an inevitable future?', origin: 'Wanda\'s Triumphant head skin description' },
          { text: 'The life of a rose garden is cyclical - blossoms wither and fade, then bloom anew.', origin: 'Wanda\'s Roseate skin description' },
          { text: 'It isn\'t a fancy occasion if you\'re not wearing gloves.', origin: 'Wanda\'s Guest of Honor hand skin description' },
          { text: 'hands touched by shadows can only spread darkness.', origin: 'Wanda\'s Triumphant hand skin description' },
          { text: 'Limbs as elegant as the rose from which they grow.', origin: 'Wormwood\'s Roseate hand skin description' },
          { text: 'Gloved hands tend the finest roses.', origin: 'Warly\'s Roseate hand skin description' },
          { text: 'Diamonds won\'t keep you warm.', origin: 'Winona\'s Snowfallen hand skin description' },
          { text: 'Don\'t worry, this won\'t hurt a bit!', origin: 'Wilson\'s Victorian hand skin description' },
          { text: 'Soft gloves to hold your heartbreak.', origin: 'Wendy\'s Victorian hand skin description' },
          { text: 'Warm your hands, and maybe even your heart.', origin: 'Wendy\'s Merrymaker hand skin description' },
          { text: 'Glittery gold beads, procured through questionable means.', origin: 'Wortox\'s Swashbuckler hand skin description' },
          { text: 'For some reason, nobody wants to hold your hand.', origin: 'Webber\'s Moonbound hand skin description' },
          { text: 'Will you reach for the light or the darkness?', origin: 'Maxwell\'s Moonbound hand skin description' },
          { text: 'A curse upon all you touch!', origin: 'WX\'s Ancient hand skin description' },
          { text: 'Reach for the stars when the night is at its darkest!', origin: 'Winona\'s Roarer hand skin description' },
          { text: 'A handful of rose petals hides away in each pocket, awaiting a dramatic moment to be tossed in the air.', origin: 'Warly\'s Roseate leg skin description' },
          { text: 'As his boots crunch through the unsullied snow, he leaves behind the only evidence of his passing; a trail of steady, methodical footprints.', origin: 'Woodie\'s Merrymaker leg skin description' },
          { text: 'You were never really the down-to-earth type, anyway.', origin: 'Wormwood\'s Moonbound leg skin description' },
          { text: 'Wrapped up, like the wearer\'s stage career.', origin: 'Maxwell\'s Masquerader leg skin description' },
          { text: 'They\'re incredibly clean... in fact, they somehow always look brand new.', origin: 'Wanda\'s Guest of Honor feet skin description' },
          { text: 'Heavy shoes to tread the path of sorrow.', origin: 'Wendy\'s Victorian feet skin description' },
          { text: 'A storyteller must always stay two steps ahead of their audience.', origin: 'Walter\'s Hallowed Nights feet skin description' },
          { text: 'The monochromatic stripes go well with any grey areas you might find yourself in.', origin: 'Maxwell\'s Moonbound feet skin description' },
          { text: 'Do not wander too quietly into the night, or Death may fail to notice you.', origin: 'Wendy\'s Masquerader feet skin description' },
          { text: 'You always felt more sure-footed standing in front of an audience than mingling with a crowd.', origin: 'Maxwell\'s Masquerader feet skin description' },
          { text: 'Tread as you will upon hallowed ground.', origin: 'WX\'s ancient feet skin description' },
          { text: 'Black suits you.', origin: 'Corrupted Cloak skin description' },
          { text: 'The darkness will protect you.', origin: 'Shadowy Armor skin description' },
          { text: 'These bones have been waiting a long time for you to wear them.', origin: 'Mythic Bone Armor skin description' },
          { text: 'Protect yourself with the fanciest old bones.', origin: 'Ornate Bone Armor skin description' },
          { text: 'Become the most dreaded warrior on the battlefield.', origin: 'Horned Dreadstone Armor skin description' },
          { text: 'Its heavy load pales in comparison to the weight on your conscience.', origin: 'Hampered Basket skin description' },
          { text: 'All hearts can be mended with time and care.', origin: 'Clement Life Amulet skin description' },
          { text: 'Some roses rebloom while others wilt and die.', origin: 'Rosy Red Amulet skin description' },
          { text: 'If at first you don\'t survive, try, try again.', origin: 'Iterum Amulet skin description' },
          { text: 'Sometimes you gotta lose it, to find it.', origin: 'Sepulchral/Qualming Amulet skin description' },
          { text: 'You\'ll get what\'s coming to you.', origin: 'Reaping Amulet skin description' },
          { text: 'There is always hope.', origin: 'Faint Gleam Amulet skin description' },
          { text: 'Laurels ought rest on you, not the other way around.', origin: 'Thorned Laurel skin description' },
          { text: 'Stay warm, honey!', origin: 'Sweet Beemuffs skin description' },
          { text: 'Sometimes you want to feel like the heroine of a Jane Austen novel.', origin: 'Straw Bonnet skin description' },
          { text: 'You feel the most comforting sensation that something\'s watching over you.', origin: 'Victorian Eyebrella skin description' },
          { text: 'BEWARE OF DOG.', origin: 'Warhound Helm skin description' },
          { text: 'These beautiful blooms have had to fight for survival in the unforgiving wilderness.', origin: 'Wildflower Helm skin description' },
          { text: 'An otherworldly spectrum of light dances around your head.', origin: 'Last Prisms skin description' },
          { text: 'Let them try to wrestle this away from you.', origin: 'Ultimate Spear skin description' },
          { text: 'Alas, we may never know what wondrous creature this wing might have once belonged to.', origin: 'Fantastical Bat skin description' },
          { text: 'Show them no mercy.', origin: 'Corrupted Blade skin description' },
          { text: 'Your enemies are usually slain before the curse can take effect. A pity, really.', origin: 'Cursed Sabre skin description' },
          { text: 'Try not to listen to its whispers…', origin: 'Twisted Dagger skin description' },
          { text: 'Beauty can be found everywhere, even in blunt force.', origin: 'Nouveau Club skin description' },
          { text: 'Lacerate with a cursed blade.', origin: 'Gatekeepers\' Club skin description' },
          { text: 'It\'s full of warm, fuzzy, stinging, and angry feelings.', origin: 'Will You Bee Mine? skin description' },
          { text: 'Trap any enemies who stop to smell the roses.', origin: 'Rose Thorn Trap skin description' },
          { text: 'Always fight fire with fire.', origin: 'Flamelash skin description' },
          { text: 'Do as a shadow and leave no trace behind.', origin: 'Shadowbeam skin description' },
          { text: 'Swing with love.', origin: 'Heartchet skin description' },
          { text: 'Just the thing to help bury those pesky feelings.', origin: 'Heart Spade skin description' },
          { text: 'Wherever you go, she goes.', origin: 'Axe n\' Chain skin description' },
          { text: 'Lovers love to walk in the rain.', origin: 'Lover\'s Umbrella skin description' },
          { text: 'April showers bring May flowers.', origin: 'Rosy Posy Parasol skin description' },
          { text: 'It\'s nice not to be the one getting eaten for a change.', origin: 'Cavernous Spidernet skin description' },
          { text: 'At first glance this torch appears menacing, but holding it makes you feel quite sad.', origin: 'Tragic Torch skin description' },
          { text: 'Rekindle an old flame.', origin: 'Vintage Lighter skin description' },
          { text: 'Some things deserve to be forgotten…', origin: 'Forsaken Lighter skin description' },
          { text: 'A dread instrument for self-surgery.', origin: 'Crimson-forged Extractor skin description' },
          { text: 'Somehow, even the light feels gloomy.', origin: 'Gothic Lantern skin description' },
          { text: 'Let them fear you. They should.', origin: 'Corrupted Cane skin description' },
          { text: 'A scepter for the king of fools.', origin: 'Fool\'s Marotte skin description' },
          { text: 'To tread ancient paths, long forgotten.', origin: 'Ancient Cane skin description' },
          { text: 'A cage even the birds will admire.', origin: 'Nouveau Bird Trap skin description' },
          { text: 'An exhaustive list of showtimes for upcoming stage performances.', origin: 'Theater Schedule skin description' },
          { text: 'Will their hot-and-cold forbidden romance last?', origin: 'part of the Mermio and Pigliet skin description' },
          { text: 'Packed with love and care.', origin: 'Cloth Wrap skin description' },
          { text: 'A heart, ripped out and offered to another.', origin: 'Stolen Heart skin description' },
          { text: 'Alas, some daggers through the heart are more literal than others.', origin: 'Daggered Heart skin description' },
          { text: 'The slings and arrows of fate have taken their toll on this poor, afflicted heart.', origin: 'Cherub\'s Heart skin description' },
          { text: 'A vibrant flame extracted in crystallized form from a passionate soul.', origin: 'Metamorphosed Flame skin description' },
          { text: 'A wispy haven for your daydreams.', origin: 'Luxurious Lean-to skin description' },
          { text: 'Have the World\'s Greatest Dreams.', origin: 'World\'s Greatest Big Top tent skin description' },
          { text: 'Step inside, and dream of long-forgotten things.', origin: 'Archaic Tent skin description' },
          { text: 'Love the new look.', origin: 'Lover\'s Wardrobe skin description' },
          { text: 'Some people would give an arm and a leg for this kind of power.', origin: 'Sorcerer\'s Circle skin description' },
          { text: 'Almost scarier than just being in the dark.', origin: 'Ornate Night Light skin description' },
          { text: 'Execute your enemies with exquisite detail.', origin: 'Intricate Turret skin description' },
          { text: 'What will you do in the name of progress?', origin: 'Experimentation Apparatus skin description' },
          { text: 'You have the most unnerving feeling that you\'re being watched.', origin: 'Ancient Sigil skin description' },
          { text: 'Something dark seems to have taken root…', origin: 'Reclaimed Relic skin description' },
          { text: 'Enjoy practicing the dark arts, in style.', origin: 'Dark Talisman skin description' },
          { text: 'This evil monstrosity will aid you in bringing horror to the world.', origin: 'Monstrous Horror skin description' },
          { text: 'Maybe a pretty cage will help the bird come to terms with its imprisonment. Probably not though.', origin: 'Baroque Birdcage skin description' },
          { text: 'This cage\'s bold design will impress even the bird it imprisons.', origin: 'Gilded Birdcage skin description' },
          { text: 'Trap birds in a prison of their own making.', origin: 'Macabre Birdcage skin description' },
          { text: 'Some like it hot, some like it even hotter.', origin: 'Lava Firepit skin description' },
          { text: 'It evokes the feeling of a cold, gothic cathedral.', origin: 'Gothic Firepit skin description' },
          { text: 'Despite the heat it provides, you can\'t help but feel a chill run down your spine.', origin: 'Foreboding Furnace skin description' },
          { text: 'Alas, no heart beats within this hollow chest.', origin: 'Lovely Chest skin description' },
          { text: 'This devious depository can only be the work of dark magic.', origin: 'Nightmarish Magician\'s Chest skin description' },
          { text: 'Behold, the power of beauty!', origin: 'Genteel Generator skin description' },
          { text: 'A brutish display of power.', origin: 'Jagged Generator skin description' },
          { text: 'The key ingredient is charm.', origin: 'Porcelain Crock Pot skin description' },
          { text: 'Winning is hard work. You deserve a rest.', origin: 'Cawnival Ribboned Chair skin description' },
          { text: 'Class over comfort!', origin: 'Wrought Iron/Antique Chair skin description' },
          { text: 'Not exactly a bed of roses, but it\'ll do.', origin: 'Rosewood Round Table skin description' },
          { text: 'There\'s a place at this table for everyone... of a certain status.', origin: 'Wrought Iron/Antique Table skin description' },
          { text: 'A single rose for simplistic beauty.', origin: 'A Singular Vase skin description' },
          { text: 'Keep your fondest memories front and center.', origin: 'Cozy Frame skin description' },
          { text: 'Dare to display your dark side.', origin: 'Bewitched Border skin description' },
          { text: 'Evenings are for remembering.', origin: 'Parlor Border skin description' },
          { text: 'For those rose-tinted rememberances.', origin: 'Rose Tinted Frame skin description' },
          { text: 'It was no fairy tale ending.', origin: 'The Fall skin description' },
          { text: 'Let fluttering butterflies guide you on your path.', origin: 'Fantasmical Path Marker skin description' },
          { text: 'On Hallowed Nights, the wise ones stay, close to the glow that keeps dark at bay.', origin: 'Jack-o-Lamptern skin description' },
          { text: 'Decorate with the Shadow Queen\'s favorite flower.', origin: 'Rose Bushel skin description' },
          { text: 'Rose thorns are nature\'s barbed wire.', origin: 'Rosy Fence skin description' },
          { text: 'Like a cake, but horrible.', origin: 'Layered Dreadstone Wall skin description' },
          { text: 'Bad luck. Good luck. Either way it\'s still adorable.', origin: 'Black Kittykit skin description' },
          { text: 'Memories are not the only things that linger.', origin: 'the Nostalgic Abigail skin description' },
          { text: 'Death is just a setback.', origin: 'the Persister Abigail skin description' },
          { text: 'Something dark has taken hold…', origin: 'the Triumphant Abigail skin description' },
          { text: 'Poor flower, plucked in its prime.', origin: 'the Roseate Abigail skin description' },
          { text: 'Life is so fragile, like a butterfly\'s wings.', origin: 'the Verdant Abigail skin description' },
          { text: 'A flower watered by a steady stream of tears.', origin: 'the Mourned Abigail skin description' },
          { text: 'This flower is always watching.', origin: 'Lureplant costume Abigail skin description' },
          { text: 'A fanciful look for an old friend.', origin: 'Fairy Glom skin description' },
          { text: 'Feel like confronting the void? Just look into his eyes!', origin: 'Hollow Gaze Hutch skin description' },
          { text: 'Beneath that abrasive exterior lies a warm and caring heart.', origin: 'Prickly Pearl skin description' },
          { text: 'Scan for secrets best left buried.', origin: 'Somber Scanalyzer skin description' },
          { text: 'It\'s not entitlement if it already belongs to you.', origin: 'Opulent Auto-Grabber skin description' },
          { text: 'It waits, watching for weakness.', origin: 'Ominous Exploiterator skin description' },
          { text: 'This otherworldly predator is an equally enticing and menacing shade of pink.', origin: 'Plantera skin description' },
          { text: 'Was that pillar there before? Have you finally gone mad?', origin: 'Dark Pillar skin description' },
          { text: 'What could reside in a place so dark and dour?', origin: 'Brooding Den skin description' },
          { text: 'What an inviting passageway, I\'ll bet it isn\'t even cursed!', origin: 'Fairy Ring skin description' },
          { text: 'All this fuss, just to return to your gloomy little life.', origin: 'Reanimation Stone skin description' },
          { text: 'You hunger for darkness, and it hungers for you.', origin: 'Nightshade Wormhole skin description' },
          { text: 'It\'s inviting you in with a big toothy grin!', origin: 'Snaggletooth Wormhole skin description' },
          { text: 'Don\'t worry, it\'s probably not carnivorous. Probably.', origin: 'Lureplant Wormhole skin description' },
      ],

        "Adventure Mode": [
        { text: 'You\'d think you would have learned your lesson by now.', origin: 'Maxwell, chapter 1 Adventure Mode' },
        { text: 'Let\'s make a deal. You can stay here. Settle down, even.', origin: 'Maxwell, chapter 3-4 Adventure Mode' },
        { text: 'All I want in return is a truce.', origin: 'Maxwell, chapter 3-4 Adventure Mode' },
        { text: 'Well would you look at that, you survived.', origin: 'Maxwell, chapter 2 Adventure Mode' },
        { text: 'Say pal. / You\'re really pushing your luck.', origin: 'Maxwell, chapter 4 non-two worlds Adventure Mode' },
        { text: 'Impressive. But you should probably stop while you\'re ahead.', origin: 'Maxwell, chapter 3 non-Two Worlds Adventure Mode' },
        { text: 'Turn back now, or I may have to resort to drastic measures.', origin: 'Maxwell, chapter 4 non-Two Worlds Adventure Mode' },
        { text: 'You insolent, pitiful, insignificant ant!', origin: 'Maxwell, chapter 5 Adventure Mode' },
        { text: 'Do not arouse the wrath of the Great Maxwell!', origin: 'Maxwell, chapter 5 Adventure Mode' },
        { text: 'You will regret coming any further…', origin: 'Maxwelll, chapter 5 Adventure Mode' },
        { text: 'Hmm. Let\'s try something a little more challenging, shall we?', origin: 'Maxwell, chapter 1 Adventure Mode' },
        { text: 'Now don\'t get a big head, you aren\'t the first.', origin: 'Maxwell, unused Adventure Mode lines' },
        { text: 'Let\'s see what you\'re really made of.', origin: 'Maxwell, unused Adventure Mode lines' },
        { text: 'I will enjoy inspecting your entrails once the Deerclops is done with you.', origin: 'Maxwell, unused Adventure Mode lines' },
        { text: 'Must I do everything myself?', origin: 'Maxwell, unused Adventure Mode lines' },
        { text: 'HOUNDS! DISPOSE OF THIS PEST!', origin: 'Maxwell, unused Adventure Mode lines' },
        { text: 'Well, this is it.', origin: 'Maxwell, unused Adventure Mode lines' },
        { text: 'You found me. Now, what are you going to do?', origin: 'Maxwell, unused Adventure Mode lines' },
        { text: 'Is this what you were expecting?', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'Is this how it ends?', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'Forgive me if I don\'t get up.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'You\'ve been an interesting plaything, but I\'ve grown tired of this game.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'They\'ll show you terrible, beautiful things.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'I\'ve learned so much since then. I\'ve built so much.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'But even a King is bound to the board.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'You can\'t change the rules of the game.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'They… they just watch. Unless you get too close… Then…', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'Well, there\'s a reason I stay so dapper.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'Go on, stay a while. Keep us company.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'It\'s your decision.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'Either way, you\'re just delaying the inevitable.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'I think I\'ve said enough.', origin: 'Maxwells final speech, Adventure Mode' },
        { text: 'I suppose I deserve that.', origin: 'Maxwell, chapter 5 Adventure Mode' },
        { text: 'Don\'t you think I\'ve tried that?', origin: 'Maxwell, chapter 5 Adventure Mode' },
        { text: 'This is the end of the line. We have no escape.', origin: 'Maxwell, chapter 5 Adventure Mode' },
        { text: 'The throne won\'t allow that. I\'ve tried.', origin: 'Maxwell, chapter 5 Adventure Mode' },
        { text: 'Time moves differently here.', origin: 'Maxwell, chapter 5 Adventure Mode' },
        { text: 'Reality is like that, sometimes.', origin: 'Maxwell, chapter 5 Adventure Mode' },
        { text: 'This may take some time…', origin: 'Maxwell, unimplemented/beta Adventure Mode intro lines' },
        { text: 'The dew has fallen with a particularly sickening thud this morning…', origin: 'Maxwell, unimplemented/beta Adventure Mode intro lines' },
        { text: 'Say pal, keep your chin up.', origin: 'part of Maxwell\'s unimplemented/beta Adventure Mode intro lines' },
        { text: 'Say pal, keep your chin up. / You will probably find it hard to stay dapper.', origin: 'Maxwell, unimplemented/beta Adventure Mode intro lines' },
        { text: 'I left you a little something… I don\'t think it will help you though.', origin: 'Maxwell, unimplemented/beta Adventure Mode intro lines' },
        { text: 'You know what I like about nighttime? All the spiders.', origin: 'Maxwell, unimplemented/beta Adventure Mode intro lines' },
        { text: 'Ah, I am a fool. I had dared to hope.', origin: 'Maxwell, unimplemented/beta Adventure Mode lines' },
        { text: 'Where would be the sport in that?', origin: 'Maxwell, unimplemented/beta Adventure Mode lines' },
        { text: 'Who do you think allowed you to make that?', origin: 'Maxwell, unimplemented/beta Adventure Mode lines' },
                ],

      "Hallowed Valentine":[
        { text: 'In lands ruled strong by shadow / Not one can trust the night', origin: 'Maxwell\'s story, 2016 hallowed nights comic' },
        { text: 'So don your chilling costumes / and steel your heart for season\'s fright', origin: 'Maxwell\'s story, 2016 Hallowed Nights comic' },
        { text: 'They failed to fear the night / Such thoughts did nary cross their head', origin: 'Maxwell\'s story, 2017 Hallowed Nights comic' },
        { text: 'And so in darkness felt the creeping / Of the shadows toward their bed,', origin: 'Maxwell\'s story, 2017 Hallowed Nights comic' },
        { text: 'Fingers born of darkest pitch / And claws of blackest shade', origin: 'Maxwell\'s story, 2017 Hallowed Nights comic' },
        { text: 'Fingers born of darkest pitch / And claws of blackest shade / Grasped tightly ‘round their ankles / And of them a puppet made,', origin: 'Maxwell\'s story, 2017 Hallowed Nights comic' },
        { text: 'Forever bound by monsters / Strung by strings that never fray,', origin: 'Maxwell\'s story, 2017 Hallowed Nights comic' },
        { text: 'So heed ye now this lesson / Never lose your fear of night,', origin: 'Maxwell\'s story, 2017 Hallowed Nights comic' },
        { text: 'Never lose your fear of night, / Lest ye too become a puppet / For the Shadow Queen\'s delight!', origin: 'Maxwell\'s story, 2017 Hallowed Nights comic' },
        { text: 'My dears, my dears, why do you stay / Bathed in that vulgar light?', origin: 'Charlie\'s story, 2019 Hallowed Nights comic' },
        { text: 'Would you not rather come and play / With Shadows in the night?', origin: 'Charlie\'s story, 2019 Hallowed Nights comic' },
        { text: 'I\'ve taught them how to dance for me / Oh, what a show to view!', origin: 'Charlie\'s story, 2019 Hallowed Nights comic' },
        { text: 'We\'d love you in our audience, A seat\'s saved just for you.', origin: 'Charlie\'s story, 2019 Hallowed Nights comic' },
        { text: 'My friends, my friends, you look so pale / No need to be afraid.', origin: 'Charlie\'s story, 2019 Hallowed Nights comic' },
        { text: 'I only want to show you all / My shadows on parade!', origin: 'Charlie\'s story, 2019 Hallowed Nights comic' },
        { text: 'You know, I too once craved the glow / Of light upon my face,', origin: 'Charlie\'s story, 2019 Hallowed Nights comic' },
        { text: 'But I have learned since then that light / Does not survive this place.', origin: 'Charlie\'s story, 2019 Hallowed Nights comic' },
        { text: 'Your existence, a whisper- forgotten, frail-', origin: 'Hallowed Nights 2024 comic' },
        { text: 'The darkness depends, Draped with despair,', origin: 'Hallowed Nights 2024 comic' },
        { text: 'Yet in your chest, a SPARK still flickers there.', origin: 'Hallowed Nights 2024 comic' },
        { text: 'You hear the echoes of laughter long past,', origin: 'Hallowed Nights 2024 comic' },
        { text: 'Fighting sleep, chasing moments that couldn\'t last.', origin: 'Hallowed Nights 2024 comic' },
        { text: 'If only for a night, to feel that warmth once more,', origin: 'Hallowed Nights 2024 comic' },
        { text: 'For when together, the Shadows will fade,', origin: 'Hallowed Nights 2024 comic' },
        { text: 'And even the lost will find light in the shade.', origin: 'Hallowed Nights 2024 comic' },
        { text: 'But for some, there is no solace in another,', origin: 'Hallowed Nights 2024 comic' },
        { text: 'For come too close, your flame they would smother.', origin: 'Hallowed Nights 2024 comic' },
        { text: 'Though they smile, it\'s a mask they wear to hide, / To obscure the darkness that festers inside.', origin: 'Hallowed Nights 2024 comic' },
        { text: 'Say pal, would you be [mine]?', origin: 'Maxwell 2016 valentine\'s day card' },
        { text: 'There\'s magic between us.', origin: 'Maxwell 2017 valentine\'s day card' },
        { text: 'Nothing could overshadow our love.', origin: 'Maxwell 2018 valentine\'s day card' },
        { text: 'Ever hunger grows relentless,', origin: 'Charlie, Hallowed Nights comic 2016' },
        { text: 'When double-cross and foul play, / become so very “every day”', origin: 'Hallowed Nights comic 2018' },
        { text: 'Such fools, such fools, you make me laugh,', origin: 'Charlie, Hallowed Nights comic 2019' },
        { text: 'And be glad that you\'ve yet to feel / The Queen of Shadow\'s ire!', origin: 'Charlie, Hallowed Nights comic 2019' },
      ],

      "Stage play": [

      { text: 'Thank you very much, you are too kind.', origin: 'line 1 of Maxwell\'s soliloquy.' },
      { text: 'And now, I will pull shadows incarnate from this mysterious tome!', origin: 'line 2 of Maxwell\'s soliloquy.' },
      { text: 'The show was better with... well, it was better before.', origin: 'line 3 of Maxwell\'s soliloquy.' },
      { text: 'I wonder how much she really remembers.', origin: 'Maxwell watching act 2 scene 1.' },
      { text: 'She won\'t like that.', origin: 'Maxwell announcing going off-script during stage play.' },
      { text: 'Are you having fun?', origin: 'Maxwell examining The Enchanted Doll, unimplemented/removed' },
      { text: 'Are you so afraid to see your old friend?', origin: 'Doll in act 2 scene 3' },
      { text: 'Why, it\'s magic, my dear!', origin: 'King in act 1 scene 3 ' },
      { text: 'And I am no simple “sir”, / but the King of this land!', origin: 'King in act 1 scene 3' },
      { text: 'How different might things have been, / if I never sought the crown?', origin: 'King\'s soliloquy, lines 1/2' },
      { text: 'I suppose the world would be a bit brighter.', origin: 'King\'s soliloquy, line 3' },
      { text: 'What a terrible thought indeed.', origin: 'King\'s soliloquy, line 4' },
      { text: 'Truth be told, / I\'ve never quite met a porcelain doll / quite so alive before.', origin: 'King in act 1 scene 3' },
      { text: 'Perhaps we could travel together? / This road is long, and can get quite lonely.', origin: 'King in act 1 scene 3' },
      { text: 'I would be delighted.', origin: 'King in act 1 scene 3' },
      { text: 'Not today little doll,', origin: 'King in act 2 scene 1' },
      { text: 'I\'m a bit under the weather.', origin: 'King in act 2 scene 1' },
      { text: 'I\'m afraid I can\'t, / there\'s a full moon out tonight!', origin: 'King in act 2 scene 1' },
      { text: 'Dear me, I couldn\'t possibly!', origin: 'King in act 2 scene 1' },
      { text: 'Don\'t you know it\'s bad luck to teach magic on Wednesdays?', origin: 'King in act 2 scene 1' },
      { text: 'No! My secret has been discovered!', origin: 'King in act 2 scene 1' },
      { text: 'Leave me be, monster! I-I\'m just a poor, frail old man!', origin: 'King in act 2 scene 3' },
      { text: 'And... er... um... You wouldn\'t hit a guy with glasses, would you?', origin: 'King in act 2 scene 3' },
      { text: 'Little doll? It can\'t be! I... that is, you...', origin: 'King in act 2 scene 3' },
      { text: 'My power? Never!', origin: 'King in act 2 scene 3' },
      { text: 'It seems that the years / had not been kind to the King,', origin: 'Narrator in act 3 scene 2' },
      { text: 'And so, / with the treacherous King gone and forgotten, / the little doll became a just and formidable Queen.', origin: 'Narrator in act 3 scene 3' },
      ],
    "Loading Screen Texts":[
      { text: 'The future might be daunting, / The present\'s scary too / But if the past has taught us anything, / Together, we\'ll get through.', origin: 'A backward Glance Vignette description' },
      { text: 'It was once thought that the beasts of the Constant were too wild and ferocious to be tamed. As it turns out, all any critter needs to make friends is a bit of love.', origin: 'Critters vignette description' },
      { text: 'It\'s a well-known fact that a group of crows is called a murder. / It is a lesser known fact that they hold crow funerals.', origin: 'aristocrat Wickerbottom vignette description' },
      { text: '”Always hold the board steady. Remember, a sharp knife is safer than a dull one. Don\'t forget.”', origin: 'Billy and Mumsy vignette description' },
      { text: 'Knowledge can consume the mind to feed the soul. / And consume the soul to feed the mind.', origin: 'Mad Scientist Wilson vignette description' },
      { text: 'The enemy of my enemy is my friend... or maybe something more?', origin: 'Got Your Back vignette description' },
      { text: 'Love can be found in the least likely places.', origin: 'Swamp-crossed Love vignette description' },
      { text: 'On a night like this, one doesn\'t want to travel alone.', origin: 'A Cold Moonlit Night vignette description' },
      { text: 'It can be hard to look to the future when your heart remains in the past.', origin: 'Glory Days vignette description' },
      { text: 'But time can change people.', origin: 'Next of Kin vignette description' },
      { text: '“Don\'t be silly, it\'s just a bad dream…”', origin: 'The Nightmare vignette description' },
      { text: 'Some things simply can\'t be undone.', origin: 'No Way Back vignette description' },
      { text: 'naughtiness always comes back to bite you in the end.', origin: 'Along Came a Spider vignette description' },
      { text: 'Freeing him might not have been my best idea.', origin: 'Nightmare Werepig vignette description' },
      { text: 'Could there be light at the end of the tunnel?', origin: 'What Lies Ahead vignette description' },
      { text: 'Open your mind to terrifying new possibilities.', origin: 'Enlight the Darkness vignette description' },
      { text: 'Don\'t let your guard down... there are eyes everywhere.', origin: 'Nightfall vignette description' },
      { text: 'It\'s the thought that counts.', origin: 'A Helping Hand vignette description' },
      { text: 'Maxwell grew quite accustomed to a world that followed his rules...', origin: 'part of The Puppetmaster vignette description' },
      { text: 'But now someone else is pulling the strings.', origin: 'part of The Puppetmaster vignette description' },
      { text: 'Few things can set the Queen of the Constant herself on edge…', origin: 'Rumblings Above vignette description' },
      { text: 'You won\'t be able to run forever.', origin: 'Narrow Escape vignette description' },
      { text: 'Who is ready to step out into the spotlight?', origin: 'A Little Drama vignette description' },
      { text: 'Everyone take your seats, the Amazing Maxwell\'s next act is about to begin.', origin: 'The Amazing Maxwell vignette description' },
      { text: 'Who, or what, will heed the call of the Shadow Queen?', origin: 'Open The Gateway vignette description' },
      { text: 'Maxwell now finds himself surviving alongside the very people he once tormented.', origin: 'lore tips' },
      { text: 'Have you met Charlie yet?', origin: 'lore tips' },
      { text: 'Some bonds transcend even death.', origin: 'lore tips' },
      { text: 'You can\'t run from Them forever. Take it from me, pal.', origin: 'Maxwell\'s lore tip' },
      { text: 'Blast this heat! Where\'s a nice, chilled drink when you need it?', origin: 'Maxwell\'s survival tip' },
      { text: 'They say the Shadow Queen herself comes at night to snatch up anyone foolish enough to wander in the dark…', origin: 'survival tip' },
      { text: 'We shouldn\'t hurt things that don\'t hurt us.', origin: 'survival tip' },
    ],
    
    "Item Descriptions":[
      { text: 'There\'s remerkable beauty within the terrifying depths of the sea.', origin: 'Shellbound portrait frame description' },
      { text: 'All things die. Not all things stay dead.', origin: 'Cemetary portrait frame description' },
      { text: 'Don\'t look behind you.', origin: 'Monstrous Horror portrait frame description' },
      { text: 'Ornaments of dread.', origin: 'Hanging Horrors portrait frame description' },
      { text: 'An empty shrine needs a sacrifice.', origin: 'Empty Pig Shrine portrait frame description' },
      { text: 'The hunt is on!', origin: 'Year of the Varg portrait frame description' },
      { text: 'Take care where you place your hands.', origin: 'Spiky Tree portrait frame description' },
      { text: 'Lucid dreaming damage', origin: 'dark sword item description' },
      { text: 'Protects your body, but not your mind.', origin: 'night armor item description' },
      { text: 'Resurrect yourself via the power of meat.', origin: 'meat effigy item description' },
      { text: 'Amplify the magical power of your top hat.', origin: 'prestihatitator item description' },
      { text: 'Music to soothe savage beasts.', origin: 'pan flute item description' },
      { text: 'Even crazy musicians amass a following', origin: 'one-man band item description' },
      { text: 'Light the night with your dreams.', origin: 'night light item description' },
      { text: 'Protects you from death.', origin: 'life giving amulet item description' },
      { text: 'What a cool amulet.', origin: 'chilled amulet item description' },
      { text: 'Induce insanity.', origin: 'nightmare amulet item description' },
      { text: 'Harness the power of combustion!', origin: 'fire staff item description' },
      { text: 'Freeze enemies in their tracks.', origin: 'ice staff item description' },
      { text: 'Make the world weep.', origin: 'dripple pipes item description' },
      { text: 'Teleport south for the winter.', origin: 'seaworthy item description' },
      { text: 'Hop on board. What could possibly go wrong?', origin: 'skyworthy item description' },
      { text: 'Evil residue used by the foolish and crazy.', origin: 'nightmare fuel item description' },
      { text: 'Have no fear, the darkness will protect you.', origin: 'dreadstone armor item description' },
      { text: 'Yes, the feather IS necessary.', origin: 'feather pencil item description' },
      { text: 'Surround yourself in the most dreadful décor.', origin: 'dreadstone wall item description' },
      { text: 'Super super soft.', origin: 'lush carpet item description' },
      { text: 'Sit back, relax, and listen to the soundtrack of your nightmares.', origin: 'gramophone item description' },
      { text: 'Pull power from the heavens.', origin: 'magiluminescence item description' },
      { text: 'These walls will take quite a beating.', origin: 'thulecite wall item description' },
      { text: 'Summon a tiny star.', origin: 'star caller\'s staff item description' },
      { text: 'Clean and efficient destruction.', origin: 'deconstruction staff item description' },
      { text: 'Spikes make everything better.', origin: 'thulecite club item description' },
      { text: 'Create horrors for your convenience.', origin: 'shadowcraft plinth kit item description' },
      { text: 'Ethereal bodyguard.', origin: 'DS-era shadow duelist item description' },
      { text: 'Ghastly revival of a ghostly friend.', origin: 'telltale heart item description' },
      { text: 'The power of darkness holDS up well under pressure.', origin: 'dreadstone pillar item description' },
      { text: 'A nightmarish cloak to keep the light at bay.', origin: 'void robe item description' },
      { text: 'Shadowy protection even from the harshest rainfall', origin: 'umbralla item description' },
      { text: 'It\'ll keep coming back for more!', origin: 'gloomerang item description' },
      { text: 'Grab the reins and reign over the battlefield', origin: 'nightmare saddle item description' },
      { text: 'Knock\'em out cold!', origin: 'flash freeze staff item description' },
      { text: 'It pleases when broken into pieces.', origin: 'portation orb fragment item description' },
      { text: 'A thorn in your side.', origin: 'rose golf course obstacle item description' },
      { text: 'A chesspiece with a checkered past.', origin: 'bishop figure item description' },
      { text: 'The most powerful piece on the board.', origin: 'queenly figure item description' },
      { text: 'Behind every queen is a dapper king.', origin: 'kingly figure item description' },
      { text: 'Writhing reinforcements', origin: 'fragment of dreaded mudslinger item description' },
    ],
    "Charlie":[
      { text: 'Pride… Arrogance… Conceit…', origin: 'Charlie speech file' },
      { text: 'This was your fault…', origin: 'Charlie speech file' },
      { text: 'You did this…', origin: 'Charlie speech file' },
      { text: 'You…', origin: 'Charlie speech file' },
      { text: 'You haven\'t escaped its pull…', origin: 'Charlie speech file' },
      { text: 'Your hubris… Maxy… it was always your weakness…', origin: 'Charlie speech file' },
      { text: '… Make your jokes… I\'ll be seeing you soon…', origin: 'Charlie speech file' },
      { text: '… I\'m so sorry, I never meant for you to come here.', origin: 'Charlie speech file' },
      { text: 'This wasn\'t a aprt of my plan, but as you\'re here now… / …I suppose I\'ll have to make do.', origin: 'Charlie speech file' },
      { text: '… I suppose I\'ll have to make do.', origin: 'Charlie speech file' },
      { text: 'You\'ve changed so much.', origin: 'Charlie speech file' },
      { text: 'How much time has passed for you?', origin: 'Charlie speech file' },
      { text: 'I should like to speak, face to face.', origin: 'Charlie speech file' },
      { text: 'The ritual demands sacrifices.', origin: 'charlie monologue for sacrifices' },
      { text: 'Seek them out. Allow them to be touched by Shadow…', origin: 'charlie monologue for sacrifices' },
      { text: 'We\'ve done it.', origin: 'charlie monologue for ritual start' },
      { text: 'They whom we call Shrouden accept our sacrifices.', origin: 'charlie monologue for ritual start' },
      { text: 'What\'s happening?!', origin: 'charlie monologue for ritual start' },
      { text: 'No! They\'re the sacrifice, not me!', origin: 'charlie monologue for ritual start' },
      ],
    

    "Shadow Mual":[
      { text: 'Why aren\'t we killing something?', origin: 'level 2-3 shadow maul' },
      { text: 'What shall we destroy next, wielder?', origin: 'level 2-3 shadow maul' },
      { text: 'We shall commit unspeakable acts of savagery!', origin: 'level 2-3 shadow maul' },
      { text: 'Mortal, do you realize what we are capable of together?', origin: 'level 2-3 shadow maul' },
      { text: 'I reflect on our path of destruction with fondness.', origin: 'level 3 shadow maul' },
      { text: 'I fell for you.', origin: 'level 2-3 shadow maul, Woodie wielder' },
      { text: 'I crave beast flesh!', origin: 'level 2-3 shadow maul, hungry' },
      { text: 'You dare neglect me, mortal?', origin: 'level 3 shadow maul, hungry' },
      { text: 'Death gives me life.', origin: 'level 3 shadow maul, hungry' },
      { text: 'Shall we murder something of consequence now?', origin: 'level 2-3 shadow maul mob kill' },
      { text: 'Nothing sweeter than death delivered by your hand and my face.', origin: 'level 2-3 shadow maul kill' },
      { text: 'Yes. / All… m-mine.', origin: 'shadow maul chopping level 1, Woodie wielder' },
      { text: 'No one will ever split us apart. / Hold me tight!', origin: 'shadow maul chopping level 2-3, Woodie wielder' },
      { text: 'Never let me go.', origin: 'shadow maul chopping level 3, Woodie wielder' },
      { text: 'Are you trying to kill me, wretched mortal?', origin: 'shadow maul level 2-3, starving' },
      { text: 'If I\'m not killing, I\'m dying!', origin: 'shadow maul level 2-3, starving' },
      { text: 'Cursed mortal / Is this the end?', origin: 'shadow maul level 3, starving' },
      { text: 'I\'m proud of us.', origin: 'shadow maul level 3, boss kill' },
      ],

    "Animated Shorts":[
      { text: 'My magic act partner has taught me so much about showmanship in such a short time.', origin: 'Charlie\'s letter, Next of Kin short' },
      { text: 'Sorry we can\'t make it.', origin: 'Charlie\'s letter, Forgone short' },
      { text: 'We have our biggest show coming up.', origin: 'Charlie\'s letter, Forgone short' },
      { text: 'It\'s easy to lose ourselves in dreams of what might have been.', origin: 'Klei description for Forgone short' },
      { text: 'But reality creeps in, quiet and inevitable like shadows at dusk.', origin: 'Klei description for Forgone short' },
      { text: 'As the shadow arc draws to a close, every promise must be honored, every debt paid.', origin: 'Klei description for Forgone short' },
      { text: 'Some things, once lost, are gone forever... but how will you know for sure unless you keep searching?', origin: 'Klei description for Hide & Seek short' },
      { text: 'In this place where lines were drawn long ago, life can be short, terrifying and chaotic, but sometimes there comes a moment that makes it worth it.', origin: 'Klei description for Tales From The Constant: Falling short' },
      { text: 'The former Nightmare King suddenly finds himself facing his past…', origin: 'Klei description for Encore short' },
      { text: 'Everyone take your seats, the Amazing Maxwell\'s next act is about to begin.', origin: 'Klei description for Encore short' },
      { text: 'It\'s been a while, old friend ♡', origin: 'Encore, animated short' },
      { text: 'But… That was all before…', origin: 'Encore, animated short' },
      { text: 'If only you had Let Me In…', origin: 'Encore, animated short' },
      { text: 'LET ME IN', origin: 'Encore, animated short' },
      { text: 'But things worked out…', origin: 'Encore, animated short' }, 
      { text: 'But things worked out… for one of us…', origin: 'Encore, animated short' },
      { text: 'Still… We made a good team once.', origin: 'Encore, animated short' },
      { text: 'What do you say, Maxy?', origin: 'Encore, animated short' },
      { text: 'Ready for an Encore? ♡', origin: 'Encore, animated short' },
      { text: 'A pause for reflection ignited… affection?', origin: 'Tales From The Constant: Falling animated short' },
      { text: 'An impact avoids impact / Ironically, saving both their hides', origin: 'Tales From The Constant: Falling, animated short' },
      { text: 'The two species collide', origin: 'Tales From The Constant: Falling, animated short' },
      { text: 'The enemy of my enemy just might be my friend.', origin: 'Tales From The Constant: Falling, animated short' },
      { text: 'We can get along, surely / Surely, here is the proof!', origin: 'Tales From The Constant: Falling, animated short' },
      { text: 'Alas, the meet-cute was ruined', origin: 'Tales From The Constant: Falling, animated short' },
      { text: 'But the strength of that limb did not match that of their love', origin: 'Tales From The Constant: Falling, animated short' },
      { text: 'This moment of respite revealed two fateful facts / The two were together and there was no going back.', origin: 'Tales From The Constant: Falling, animated short' },
      { text: '[William] felt true power for the first time in his life.', origin: 'DST compendium entry' },

      ],
    "William Carter Puzzles":[

      { text: 'You better pay up this week or there will be trouble! I will find you!', origin: 'note to William from Witherstone, William Carter Puzzles' },
      { text: 'The missing man has been presumed dead.', origin: 'newspaper, William Carter Puzzles' },
      { text: 'All will be explained when we meet.', origin: 'letter to Jack, William Carter Puzzles' },
      { text: 'My fear was so great that I almost faltered in my incantations.', origin: 'Maxwell\'s journal, William Carter Puzzles' },
      { text: 'Previous experience unnecessary, but should have a curious demeanor and a keen interest in the mysteries of the universe.', origin: 'Maxwell\'s ad, William Carter Puzzles' },
      { text: 'Must provide own costume.', origin: 'Maxwell\'s ad, William Carter Puzzles' },
      { text: 'PERFORMING FEATS TO ASTOUND AND MYSTIFY', origin: 'Maxwell\'s poster, William Carter Puzzles' },
      { text: 'Hey Maxy, we really knocked ‘em dead last night, didn\'t we?', origin: 'Charlie\'s letter, William Carter Puzzles' },
      { text: 'Those shadow things are so convincing – they almost scare me, and I\'m part of the act!', origin: 'Charlie\'s letter, William Carter Puzzles' },
      { text: 'devinctionibus / pretiositas / Enough! / insaniam', origin: 'Maxwell\'s walls, William Carter Puzzles' },
      { text: 'alucinatio / voces / tenebris / Charlie / Charlie / Charlie', origin: 'Maxwell\'s walls, William Carter Puzzles' },
      { text: 'Max, where are you?', origin: 'Charlie\'s second letter, William Carter Puzzles' },
      { text: 'XO, Charlie', origin: 'Charlie\'s second letter, William Carter Puzzles' },
      { text: 'quiet / illuminate / perplexing / curiosity / trapped', origin: 'official image titles, William Carter Puzzles' },
      { text: 'introrsus / regret / panic / remorse / … / ruined', origin: 'official image titles, William Carter Puzzles' },
      ],
    "Ancient Fuelweaver":[
      { text: 'You will not suffer. / It must not be this way.', origin: 'Ancient Fuelweaver, battlecry' },
      { text: 'I will save you.', origin: 'Ancient Fuelweaver, player battlecry' },
      { text: 'How long have I slumbered?', origin: 'Ancient Fuelweaver, woven shadow summon' },
      { text: 'You will rip apart at the seams.', origin: 'Ancient Fuelweaver, woven shadow summon' },
      { text: 'Let us end it.', origin: 'Ancient Fuelweaver, woven shadow summon' },
      { text: 'You cannot win.', origin: 'Ancient Fuelweaver, unseen hands summon' },
      { text: 'Lend me your power, one last time.', origin: 'Ancient Fuelweaver, unseen hands summon' },
      { text: 'Protect me.', origin: 'Ancient Fuelweaver, unseen hands summon' },
      { text: 'You cannot hurt me.', origin: 'Ancient Fuelweaver, unseen hands summon' },
      { text: 'You have been betrayed.', origin: 'Ancient Fuelweaver, unseen hands summon' },
      { text: 'Metheus… / I must do this, for your sake.', origin: 'Ancient Fuelweaver, gateway turned off' },
      { text: 'It cannot end like this.', origin: 'Ancient Fuelweaver, gateway turned off' },
      { text: 'I was wrong.', origin: 'Ancient Fuelweaver, gateway turned off' },
      { text: 'Please…', origin: 'Ancient Fuelweaver, player leaving battle' },
      { text: 'Fools!', origin: 'Ancient Fuelweaver, death cry' },
      { text: 'Are you so easily deceived? Ha…', origin: 'Ancient Fuelweaver, death cry' },
      { text: 'you deserve this.', origin: 'Ancient Fuelweaver, death cry' },
      { text: 'You\'ve made your choice.', origin: 'Ancient Fuelweaver, death cry' },
      { text: 'It\'s all happening again…', origin: 'Ancient Fuelweaver, battle cry with gateway fixed' },
      { text: 'I tried to stop it… It seems I learned nothing…', origin: 'Ancient Fuelweaver, battle cry with gateway fixed' },
      { text: 'You fools! What have you done?', origin: 'Ancient Fuelweaver, player cry with gateway fixed' },
      { text: 'You\'ve doomed yourselves.', origin: 'Ancient Fuelweaver, player cry with gateway fixed' },
      { text: 'You have brought about your own end.', origin: 'Ancient Fuelweaver, player cry with gateway fixed' },
      { text: 'Please. Let me save you from what is coming.', origin: 'Ancient Fuelweaver, player cry with gateway fixed' },
      { text: 'I recognize your arrogance. I possessed it myself.', origin: 'Ancient Fuelweaver, player cry with gateway fixed' },
      { text: 'They will not show mercy as I have.', origin: 'Ancient Fuelweaver, death cry with gateway fixed' },
      { text: 'You\'ve made your choice.', origin: 'Ancient Fuelweaver, death cry with gateway fixed' },
      { text: 'I couldn\'t stop it…', origin: 'Ancient Fuelweaver, death cry with gateway fixed' },
      { text: 'The battle… I lost…', origin: 'fuelweaver ally spawn monologue' },
      { text: 'You…! What have you done?!', origin: 'fuelweaver ally spawn monologue' },
      { text: 'They are waiting…', origin: 'fuelweaver ally spawn monologue' },
      { text: 'You have chosen… This innocent creature…', origin: 'fuelweaver ally boss corruption monologue' },
      { text: 'To be woven… And be made an offering… To Them.', origin: 'fuelweaver ally boss corruption monologue' },
      { text: 'As you wish… It is done.', origin: 'fuelweaver ally boss corruption monologue' },
      { text: 'My once glorious kingdom is now a tomb.', origin: 'fuelweaver ally seeing atrium' },
      { text: 'What have I done?', origin: 'fuelweaver ally seeing atrium' },
      { text: 'I was a damned fool.', origin: 'fuelweaver ally seeing atrium' },
      { text: 'How do you fight an enemy that has taken root in your very being?', origin: 'fuelweaver ally seeing military ruins' },
      { text: 'I have desecrated these sacred grounds.', origin: 'fuelweaver ally seeing sacred ruins' },
      { text: 'The cursed fuel has defiled all.', origin: 'fuelweaver ally seeing sacred ruins' },
      { text: 'I can\'t bear the sight of it.', origin: 'fuelweaver ally seeing sacred ruins' },
      { text: 'Better to be lost here. Wandering for an eternity…', origin: 'fuelweaver ally seeing ruins labyrinth' },
      { text: 'Have you returned? Alas… not soon enough.', origin: 'fuelweaver ally seeing lunar grotto' },
      { text: 'We lived in the light once.', origin: 'fuelweaver ally seeing archives' },
      { text: 'An age of brilliance.', origin: 'fuelweaver ally seeing archives' },
      { text: 'This is all that remains.', origin: 'fuelweaver ally seeing archives' },
      { text: 'They trusted no one… especially me.', origin: 'fuelweaver ally seeing sanctum vault' },
      { text: 'It is… me.', origin: 'fuelweaver ally inspecting self statue' },
      { text: 'How long as it been… What have I become?', origin: 'fuelweaver ally inspecting self statue' },
      { text: 'All lost… because of me.', origin: 'fuelweaver ally inspecting sanctum gateway' },
      { text: 'It promised… All lies…', origin: 'fuelweaver ally inspecting sanctum gateway' },
      { text: 'I was blind… a fool.', origin: 'fuelweaver ally inspecting sanctum gateway' },
      { text: 'They stand guard over a doomed world.', origin: 'fuelweaver ally inspecting sanctum guard statues' },
      { text: 'Fools fated to repeat the same mistakes.', origin: 'fuelweaver ally inspecting sanctum guard statues' },
      { text: 'Was I not worthy of your trust?', origin: 'fuelweaver ally inspecting elytra\'s body' },
      { text: 'What secret did you guard until your last breath?', origin: 'fuelweaver ally inspecting elytra\'s body' },
      { text: 'How unbearable that weight must have been upon your soul… if it is still yours.', origin: 'fuelweaver ally inspecting elytra\'s body' },
      { text: 'Poison? Did you know what it held? Did you choose it?', origin: 'fuelweaver ally inspecting visionist\'s body' },
      { text: 'Why was death itself poured as your reward?', origin: 'fuelweaver ally inspecting visionist\'s body' },
      { text: 'May your vision be restored, clear and made whole beyond the shroud.', origin: 'fuelweaver ally inspecting visionist\'s body' },
      { text: 'This world is no longer our own.', origin: 'fuelweaver ally inspecting visionist\'s body' },
      { text: 'So this is the cruel fate that befell my dear friend.', origin: 'fuelweaver ally inspecting artificer\'s body' },
      { text: 'You deserved a far better end than this.', origin: 'fuelweaver ally inspecting artificer\'s body' },
      { text: 'Yet you escaped… damning yourself.', origin: 'fuelweaver ally inspecting sanctum rune stones' },
      { text: 'A fool in your wisdom…', origin: 'fuelweaver ally inspecting sanctum rune stones' },
      { text: 'It\'s too late.', origin: 'fuelweaver ally inspecting sanctum rune stones' },
      { text: 'Better one should wall than all.', origin: 'fuelweaver ally inspecting sequitor puzzle' },
      { text: 'I\'ve seen the way and it is cursed.', origin: 'fuelweaver ally inspecting flummoxing flame puzzle' },
      { text: 'Your devotion to my beloved shall never be forgotten.', origin: 'fuelweaver ally inspecting elytra mask' },
      { text: 'What words did she impart to you in those darkest of days?', origin: 'fuelweaver ally inspecting elytra mask' },
      { text: 'How I have missed you, old friend.', origin: 'fuelweaver ally inspecting artificer mask' },
      { text: 'Never one to temper the truth, nor spare a wounded heart.', origin: 'fuelweaver ally inspecting artificer mask' },
      { text: 'May you finally know rest.', origin: 'fuelweaver ally inspecting artificer mask' },
      { text: 'My heart aches at the fate of your glorious design. It is a mercy that your eyes shall never behold its ruin.', origin: 'fuelweaver ally inspecting visionist mask' },
      { text: 'So afraid of the dark…', origin: 'fuelweaver ally inspecting nightmare light' },
      { text: 'But all who bathed in the glow… lost themselves to madness.', origin: 'fuelweaver ally inspecting nightmare light' },
      { text: 'You left us little choice.', origin: 'fuelweaver ally inspecting nightmare ramparts' },

      function getCenteredScrollFor(card) {
        const containerHeight = sentenceList.clientHeight;
        const raw = card.offsetTop + card.offsetHeight / 2 - containerHeight / 2;
        const halfScroll = getHalfScroll();
        return ((raw % halfScroll) + halfScroll) % halfScroll;
      }

      function spinWheel() {
        if (isSpinning || isWinnerShown || isHistoryShown) return;

        const options = displayedItems;
        const cards = sentenceTrack.querySelectorAll('.sentence-item');
        const halfScroll = getHalfScroll();

        if (!options.length || !cards.length || halfScroll <= 0) return;

        isSpinning = true;
        playSound(loadHistory().length >= 2 ? 'clickspinfinal' : 'clickspinnormal');
        setControlsLocked(true);

        const winnerIndex = Math.floor(Math.random() * options.length);
        const targetCard = cards[winnerIndex];
        const targetPos = getCenteredScrollFor(targetCard);
        const startPos = ((scrollOffset % halfScroll) + halfScroll) % halfScroll;

    
        let forwardDistance = targetPos - startPos;
        if (forwardDistance <= 0) forwardDistance += halfScroll;
        const totalDistance = forwardDistance + SPIN_LOOPS * halfScroll;

        const startTime = performance.now();

        function animateSpin(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / SPIN_DURATION, 1);
          const eased = 1 - Math.pow(1 - progress, 4);
          const currentPos = (startPos + totalDistance * eased) % halfScroll;
          setTrackPosition(currentPos);

          if (progress < 1) {
            requestAnimationFrame(animateSpin);
          } else {
            setTrackPosition(targetPos);
            scrollOffset = targetPos;
            winnerText.textContent = getSentenceText(options[winnerIndex]);
            addHistoryEntry(getSentenceText(options[winnerIndex]), getSentenceOrigin(options[winnerIndex]));
            playSound('resultreceived');
            winnerOverlay.classList.add('visible');
            isSpinning = false;
            isWinnerShown = true;
            spinButton.disabled = true;
          }
        }

        requestAnimationFrame(animateSpin);
      }

      function closeWinnerCard() {
        if (!isWinnerShown) return;
        winnerOverlay.classList.remove('visible');
        isWinnerShown = false;
        setControlsLocked(false);
      }

      let lastFrameTime = null;

      function animateSlowScroll(currentTime) {
  
        if (lastFrameTime === null) lastFrameTime = currentTime;
        const deltaMs = Math.min(currentTime - lastFrameTime, 250);
        lastFrameTime = currentTime;

        if (!isSpinning) {
          const halfScroll = getHalfScroll();
          if (halfScroll > 0) {
            scrollOffset += slowScrollSpeed * (deltaMs / (1000 / 60));
            scrollOffset = ((scrollOffset % halfScroll) + halfScroll) % halfScroll;
            setTrackPosition(scrollOffset);
          }
        }

        requestAnimationFrame(animateSlowScroll);
      }

      spinButton.addEventListener('click', spinWheel);
      winnerOverlay.addEventListener('click', closeWinnerCard);
      historyButton.addEventListener('click', () => {
        playSound('clickbutton');
        openHistory();
      });
      historyButton.addEventListener('mouseenter', () => {
        if (isSpinning || isWinnerShown || isHistoryShown) return;
        animateHistoryFrames([0, 1, 2], () => {
          setHistoryFrame(2);
        });
      });
      historyButton.addEventListener('mouseleave', () => {
        if (isHistoryShown) return;
        animateHistoryFrames([2, 1, 0], () => {
          setHistoryFrame(0);
        });
      });
      historyButton.addEventListener('pointerdown', () => {
        if (isSpinning || isWinnerShown || isHistoryShown) return;
        historyButton.classList.add('pressed');
        setHistoryFrame(2);
      });
      historyButton.addEventListener('pointerup', () => {
        historyButton.classList.remove('pressed');
        if (!isHistoryShown && !historyButton.matches(':hover')) {
          setHistoryFrame(0);
        }
      });
      historyButton.addEventListener('pointerleave', () => {
        historyButton.classList.remove('pressed');
        if (!isHistoryShown && !historyButton.matches(':hover')) {
          setHistoryFrame(0);
        }
      });
      historyButton.addEventListener('pointercancel', () => {
        historyButton.classList.remove('pressed');
        if (!isHistoryShown && !historyButton.matches(':hover')) {
          setHistoryFrame(0);
        }
      });
   
      historyOverlay.addEventListener('click', (e) => {
        if (e.target === historyOverlay) closeHistory();
      });

     
      renderCategories();
      renderSentences();
      updateSpinAvailability();
      requestAnimationFrame(animateSlowScroll);


      const afkOverlay = document.getElementById('afkOverlay');
      const afkText = document.getElementById('afkText');
      const AFK_TIMEOUT_NORMAL = 34 * 1000;   
      const AFK_TIMEOUT_HISTORY_OPEN = 4.7 * 60 * 1000;
      const AFK_MESSAGES = [
        "Maxwell is going to miss you!",
        "Charlie is going to miss you!",
      ];
      let afkTimer = null;

      function scheduleAfkWarning() {
    clearTimeout(afkTimer);
    afkOverlay.classList.remove('visible');

      const timeout = isHistoryShown ? AFK_TIMEOUT_HISTORY_OPEN : AFK_TIMEOUT_NORMAL;

      afkTimer = setTimeout(() => {
        
        if (isHistoryShown) return;
        afkText.textContent = AFK_MESSAGES[Math.floor(Math.random() * AFK_MESSAGES.length)];
        playSound('missyouidle');
        afkOverlay.classList.add('visible');
      }, timeout);
    }

      document.addEventListener('click', scheduleAfkWarning);
      scheduleAfkWarning();
    </script>
  </body>
</html>
