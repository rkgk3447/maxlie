<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentence Wheel</title>
    <style>
      :root {
        --bg: #0e0f12;
        --panel: #171a1e;
        --panel-alt: #101317;
        --carpet-pattern: url('carpet.png');
        --card: rgba(255, 255, 255, 0.026);
        --card-border: rgba(255, 255, 255, 0.09);
        --text: #f2f4f8;
        --muted: #bcc5d4;
        --accent: #d9d9d9;
        --accent-strong: #b5b5b5;
        --soft: rgba(255, 255, 255, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: "Lancelot", serif;
        background-color: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: center;
        min-height: 100vh;

      }

      .app {
        width: 100%;
        max-width: 1800px;
        height: 100vh;
        display: flex;
        overflow: hidden;
        background: rgba(10, 11, 15, 0.64);
      }

      .sentence-panel {
        flex: 1.8;
        min-width: 0;
        position: relative;
        background: rgba(17, 19, 23, 0.76);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }

      .sentence-list {
        height: 100%;
        overflow: hidden;
        padding: 18px 18px 20px;
        position: relative;
        background: linear-gradient(to bottom, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
        isolation: isolate;
      }

      .sentence-list::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: var(--carpet-pattern);
        background-repeat: repeat;
        background-position: center center;
        background-size: 512px 512px;
        opacity: 0.12;
        z-index: -1;
      }

      .sentence-track {
        will-change: transform;
        position: relative;
        z-index: 10;
      }

      .sentence-item {
        position: relative;
        display: block;
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 10px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.02);
        color: rgba(242, 244, 248, 0.68);
        font-size: 0.98rem;
        line-height: 1.55;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        filter: blur(1.6px);
        transition: color 0.18s ease, opacity 0.18s ease;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .sentence-item::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px,
          transparent 7px
        );
        opacity: 0.55;
      }

      .category-panel {
        width: 340px;
        min-width: 260px;
        background: rgba(14, 15, 18, 0.78);
        padding: 26px 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .title {
        margin: 0;
        font-size: clamp(1.5rem, 1.8vw, 2.2rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
      }

      .category-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;      
      min-height: 0;    
      overflow-y: auto; 
      scrollbar-width: thin;
      scrollbar-color: #7a0d0d rgba(255, 255, 255, 0.05); 
    }

    .category-list::-webkit-scrollbar {
      width: 10px;
    }

    .category-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
    }

    .category-list::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #b60a0a, #5a0606);
      border-radius: 6px;
      border: 2px solid rgba(12, 13, 16, 0.92);
    }

    .category-list::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #d61111, #7a0d0d);
    }

      .category-button {
        width: 100%;
        padding: 14px 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background-color: rgba(22, 18, 28, 0.42);
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px) saturate(1.1);
        -webkit-backdrop-filter: blur(10px) saturate(1.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), inset 0 -1px 0 rgba(0, 0, 0, 0.3);
        color: var(--text);
        text-align: left;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, filter 0.12s ease;
      }

      .category-button:hover {
        background-color: rgba(34, 24, 43, 0.62);
        background-image: none;
      }

      .category-button:active,
      .category-button.pressed {
        background-color: rgba(18, 15, 23, 0.7);
        background-image: none;
        border-color: rgba(255, 255, 255, 0.08);
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .category-button.active {
        background-color: #5a5a5a;
        background-image: linear-gradient(135deg, #b60a0a, #5a5a5a);
        border-color: transparent;
        color: #fff;
      }

      .category-button.active:active,
      .category-button.active.pressed {
        filter: brightness(0.72) saturate(0.8);
      }

      .category-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .action-row {
        margin-top: auto;
        display: flex;
        align-items: stretch;
        gap: 10px;
      }

      .spin-button {
        flex: 1;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: var(--panel-alt);
        color: var(--text);
        padding: 16px 18px;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, filter 0.12s ease;
      }

      .spin-button:hover {
        background: #171b21;
      }

      .spin-button:active,
      .spin-button.pressed {
        background: #0c0e11;
        border-color: rgba(255, 255, 255, 0.12);
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .spin-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .history-button {

        width: clamp(52px, 6vw, 76px);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: var(--panel-alt);
        aspect-ratio: 1;
        padding: 0;
        overflow: hidden;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, filter 0.12s ease;
      }

      .history-button:hover {
        background: #171b21;
      }

      .history-button:active,
      .history-button.pressed {
        background: #0c0e11;
        border-color: rgba(255, 255, 255, 0.12);
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .history-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .history-button-icon {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: fill;
        pointer-events: none;
        user-select: none;
      }

      .history-button:active .history-button-icon,
      .history-button.pressed .history-button-icon {
        filter: brightness(0.7) saturate(0.8);
      }

      .history-button.is-animating .history-button-icon {
        transform: scale(1.04);
      }

      .winner-overlay,
      .history-overlay,
      .afk-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease, visibility 0.2s ease;
        z-index: 201;
      }

      .winner-overlay.visible,
      .history-overlay.visible,
      .afk-overlay.visible {
        opacity: 1;
        visibility: visible;
      }

     
      .ghost-overlay {
        position: absolute; 
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transform: translateY(70px);
        transition: opacity 0.5s ease-in, transform 0.5s cubic-bezier(0.5, 0, 1, 1),
          visibility 0s linear 0.5s;
        z-index: 1; 
      }

      .ghost-overlay.visible {
        opacity: 0.85;
        visibility: visible;
        transform: translateY(0);
        transition: opacity 0.2s ease-out, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
          visibility 0s linear 0s;
      }

  
      .ghost-viewport {
        position: relative;
        overflow: hidden;
        width: min(58vw, 480px);
        height: calc(100% - clamp(20px, 4vh, 40px));
        margin-top: clamp(20px, 4vh, 40px);
      }

      .ghost-img {
        position: absolute;
        top: 50%;
        left: 50%;
        object-fit: cover;
        
        object-position: 100% 50%;
        transform: translate(-50%, -50%) rotate(-90deg);
        transform-origin: center center;
        will-change: transform;
        user-select: none;
        -webkit-user-drag: none;
       
      }

      @media (max-width: 900px) {
        .ghost-viewport {
          width: min(78vw, 420px);
        }
      }

      .winner-card {
        position: relative;
        width: min(760px, 90vw);
        background: rgba(12, 13, 16, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 30px 26px;
        text-align: center;
        overflow: hidden;
        isolation: isolate;
      }


        .winner-card::before {
          content: "";
          position: absolute;
          inset: 0;
          background: var(--rose-pattern, url('Maxblonda/whiterose.png')) center center / cover no-repeat;
          opacity: 0.20;
          z-index: 0;
          pointer-events: none;
}
          :root {
            --rose-pattern: url('Maxblonda/whiterose.png');
          }


      .winner-card > * {
        position: relative;
        z-index: 1;
      }

      .history-card {
        width: min(760px, 90vw);
        max-height: 80vh;
        overflow-y: auto;
        background: rgba(12, 13, 16, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 30px 26px;
        text-align: left;
        scrollbar-width: thin;
        scrollbar-color: #7a0d0d rgba(255, 255, 255, 0.05);
      }

      .history-card::-webkit-scrollbar {
        width: 10px;
      }

      .history-card::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.04);
      }

      .history-card::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #b60a0a, #5a0606);
        border-radius: 6px;
        border: 2px solid rgba(12, 13, 16, 0.92);
      }

      .history-card::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #d61111, #7a0d0d);
      }

      .history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .clear-history-button {
        background: transparent;
        border: 1px solid rgba(182, 10, 10, 0.45);
        color: #ff6b6b;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 7px 12px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease, filter 0.12s ease, transform 0.12s ease;
      }

      .clear-history-button:hover {
        background: rgba(182, 10, 10, 0.16);
        border-color: rgba(182, 10, 10, 0.8);
      }

      .clear-history-button:active,
      .clear-history-button.pressed {
        background: rgba(182, 10, 10, 0.08);
        border-color: rgba(182, 10, 10, 0.75);
        color: #d75f5f;
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .clear-history-button:disabled {
        border-color: rgba(120, 120, 120, 0.65);
        background: rgba(90, 90, 90, 0.18);
        color: rgba(200, 200, 200, 0.8);
        cursor: not-allowed;
        opacity: 0.7;
      }

      .clear-history-button:disabled:hover {
        background: rgba(90, 90, 90, 0.18);
        border-color: rgba(120, 120, 120, 0.65);
      }

      .history-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 14px;
      }

      .history-entry {
        display: flex;
        flex-direction: column;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .history-entry-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
      }

      .history-entry-text {
        color: #f7f9ff;
        line-height: 1.5;
        user-select: none;
      }

      .history-entry-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .spoiler-button {
        flex-shrink: 0;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: var(--text);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 5px 10px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, filter 0.12s ease, transform 0.12s ease;
      }

      .spoiler-button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .spoiler-button:active,
      .spoiler-button.pressed {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.18);
        color: rgba(242, 244, 248, 0.9);
        filter: brightness(0.72) saturate(0.8);
        transform: translateY(1px);
      }

      .history-entry-date {
        flex-shrink: 0;
        color: var(--muted);
        font-size: 0.85rem;
        white-space: nowrap;
      }

      .history-entry-origin {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        margin-top: 0;
        color: #9a9a9a;
        font-size: 0.85rem;
        font-style: italic;
        line-height: 1.5;
        user-select: none;
        transition: max-height 0.25s ease, opacity 0.2s ease, margin-top 0.25s ease;
      }

      .history-entry-origin.visible {
        max-height: 200px;
        opacity: 1;
        margin-top: 8px;
      }

      .history-empty {
        color: var(--muted);
        margin: 0;
      }

      .winner-label {
        display: inline-block;
        margin-bottom: 12px;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .winner-text {
        margin: 0;
        font-size: clamp(1.25rem, 2vw, 2.2rem);
        line-height: 1.55;
        color: #f7f9ff;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      @media (max-width: 900px) {
        .app {
          flex-direction: column;
          height: auto;
          min-height: 100vh;
        }

        .sentence-panel {
          min-height: 58vh;
          border-right: none;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .category-panel {
          width: 100%;
          min-width: 0;
          max-height: 46vh;
        }

      }

    
      .afk-card {
        position: relative;
        width: min(560px, 90vw);
        background: rgba(12, 13, 16, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 26px 24px;
        text-align: center;
      }

      .afk-text {
        margin: 0;
        font-size: clamp(1.05rem, 1.6vw, 1.6rem);
        line-height: 1.5;
        color: #f7f9ff;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="sentence-panel">
        <div class="sentence-list" id="sentenceList" aria-live="polite">
          <div class="sentence-track" id="sentenceTrack"></div>

          
          <div class="ghost-overlay" id="ghostOverlay" aria-hidden="true">
            <div class="ghost-viewport" id="ghostViewport">
              <img src="watcher/frame-0.png" alt="" class="ghost-img" id="ghostImg">
            </div>
          </div>
        </div>
      </main>

      <aside class="category-panel">
        <h1 class="title">Sentences</h1>
        <div class="category-list" id="categoryList"></div>
        <div class="action-row">
          <button class="spin-button" id="spinButton" type="button">LETS GO GAMBLING</button>
          <button class="history-button" id="historyButton" type="button" aria-label="View your spin history">
            <img src="evilflower.png" alt="" class="history-button-icon" id="historyButtonIcon">
          </button>
        </div>
      </aside>
    </div>

    <div class="winner-overlay" id="winnerOverlay" aria-live="assertive">
      <div class="winner-card">
        <span class="winner-label">The Ancients have spoken</span>
        <p class="winner-text" id="winnerText"></p>
      </div>
    </div>

    <div class="afk-overlay" id="afkOverlay" role="status" aria-live="polite">
      <div class="afk-card">
        <span class="winner-label">Still there?</span>
        <p class="afk-text" id="afkText"></p>
      </div>
    </div>

    <div class="history-overlay" id="historyOverlay" aria-live="polite">
      <div class="history-card">
        <div class="history-header">
          <span class="winner-label">History</span>
          <button class="clear-history-button" id="clearHistoryButton" type="button">Clear History</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

          { text: 'I don\'t think she\'d take kindly to that.', origin: 'Maxwell announcing can\'t shave beefalo, DS' },

          { text: 'Truthfully I was always a hack.', origin: 'Maxwell examining machete, DS' },
          { text: 'Beautiful on the outside, destructive on the inside.', origin: 'Maxwell examining howling conch, DS' },
          { text: 'We are all trapped, in one way or another.', origin: 'Maxwell examining Woodlegs\' cage, DS' },
          { text: 'I\'ll be taking that blood back, thank you.', origin: 'Maxwell examining yellow mosquito sack, DS' },
          { text: 'It\'s not a question of if I will conquer it, but when.', origin: 'Maxwell examining sea hound, DS' },
          { text: 'Surrender to me.', origin: 'Maxwell examining blue whale, DS' },
          { text: 'You will bow to me.', origin: 'Maxwell examining Quacken, DS' },
          { text: 'Not something a gentleman handles without gloves.', origin: 'Maxwell examining eye of the Tiger Shark, DS' },
          { text: 'I like it better dead.', origin: 'Maxwell examining dead jellyfish, DS' },
          { text: 'The inside is filthy.', origin: 'Maxwell examining tarnished crown, DS' },
          { text: 'My vessel is sustaining damage.', origin: 'Maxwell announcing boat durability loss, DS' },
          { text: 'I hope you are ready.', origin: 'Maxwell\'s removed seaworthy quote, DS' },
          { text: 'Which unfortunate soul was that?', origin: 'Maxwell examining crime rug, DS' },
          { text: 'Still grotesque.', origin: 'Maxwell examining sleeping mant, DS' },
          { text: 'Just useful enough to keep around.', origin: 'Maxwell examining Ro Bin, DS' },
          { text: 'Ah, metamorphosis...', origin: 'Maxwell examining glowfly cocoon, DS' },
          { text: 'I was meant to be king.', origin: 'Maxwell examining royal crown, DS' },
          { text: 'A potent fragment of a shadowy figure.', origin: 'Maxwell examining dark tatters, DS' },
          { text: 'Destructive. I like it.', origin: 'Maxwell examining executive hammer, DS' },
          { text: 'I AM SUPERIOR!', origin: 'Maxwell announcing living artifact put on, DS' },
          { text: 'That\'ll teach it to not be me.', origin: 'Maxwell examining mined Glommer\'s statue, DS' },
          { text: 'The master becomes the student.', origin: 'Maxwell examining player\'s skeleton, DS' },
          { text: 'Hey, that\'s not a statue of me!', origin: 'Maxwell examining Glommer\'s statue, DS' },
          { text: 'Looking good!', origin: 'Maxwell examining NPC Maxwell, DS' },
          { text: 'A gentleman\'s weapon.', origin: 'Maxwell examining cutlass supreme, DS' },
          { text: 'I found that wholly unenjoyable. I swear.', origin: 'Maxwell examining sandcastle, DS' },
          { text: 'I may have overdone it.', origin: 'Maxwell examining buoyant chiminea at max fuel, DS' },
          { text: 'It can\'t hurt anyone anymore.', origin: 'Maxwell examining palm tree sapling, DS' },
          { text: 'Quite uncouth.', origin: 'Maxwell examining dragoon saliva, DS' },
          { text: 'Hearts only bring pain anyway.', origin: 'Maxwell examining dragoon heart, DS' },
          { text: 'Ah, I do enjoy the finer things.', origin: 'Maxwell examining lobster bisque, DS' },
          { text: 'Exactly what it looks like. Err... What does it look like?', origin: 'Maxwell examining sextant, DS' },
          { text: 'I am consumed by the abyss!', origin: 'Maxwell announcing map border crossing, DS' },
          { text: 'There\'s no need for such an outburst.', origin: 'Maxwell announcing volcano eruption, DS' },
          { text: 'Do I dare play with more forces beyond my control?', origin: 'Maxwell examining active volcano altar, DS' },
          { text: 'Is this amusing?', origin: 'Maxwell examining pirate hat, DS' },
          { text: '"It\'s working its way down."', origin: 'Maxwell examining sinking trawl net, DS' },
          { text: 'It will hold off my vessel\'s inevitable decay.', origin: 'Maxwell examining boat repair kit, DS' },
          { text: 'Goodness. It\'s been awhile since I played.', origin: 'Maxwell examining dripple pipes, DS' },
          { text: 'I won\'t be using it any longer.', origin: 'Maxwell examining burnt meat effigy, DS' },
          { text: 'Protects my most important part.', origin: 'Maxwell examining pith hat, DS' },
          { text: 'Someone will pay for that.', origin: 'Maxwell examining burnt slanty shanty, DS' },
          { text: 'Essential when dealing with... fluids.', origin: 'Maxwell examining rubbermat rug, DS' },
          { text: 'That was simply undignified.', origin: 'Maxwell examining picked dung pile, DS' },
          { text: 'Don\'t make me do something I\'ll regret.', origin: 'Maxwell examining rabid pog, DS' },
          { text: 'Am I supposed to be intimidated?', origin: 'Maxwell examining royal palace guard, DS' },
          { text: 'What a delightful color.', origin: 'Maxwell examining obsidian, DS' },
          { text: 'Size truly doesn\'t matter!', origin: 'Maxwell examining blue whale carcass, DS' },
          { text: 'We meet again.', origin: 'Maxwell examining white whale, DS' },
          { text: 'Say pal, you don\'t look so good...', origin: 'you already know where this is from' },
        ],

        "Don't Starve together": [
          { text: 'Charlie always complained about being cold. Sigh.', origin: 'Maxwell examining fire nettle tea, DST' },
          { text: 'Must everything be about my shortcomings?', origin: 'Maxwell examining queenly figure, DST' },
          { text: 'The show must go on.', origin: 'Maxwell examining Codex Umbra, DST' },
          { text: 'Are you prepared for what you\'ll find?', origin: 'Maxwell examining rose-colored glasses, DST' },
          { text: 'My... favorite... she remembered.', origin: 'Maxwell examining heavenly eggnog, DST' },
          { text: 'Starting to feel left out?', origin: 'Maxwell examining Charlie\'s carrat, DST' },
          { text: 'This is wrong.', origin: 'Maxwell examining rose, DST' },
          { text: 'Always did have a flair for the dramatic...', origin: 'Maxwell examining florid postern, DST' },
          { text: 'She\'s still in there somewhere. I know it.', origin: 'Maxwell examining comedy statue, DST' },
          { text: 'Her tragedy does not define her.', origin: 'Maxwell examining tragedy statue, DST' },
          { text: 'Needs something. Perhaps some long-stemmed roses...', origin: 'Maxwell examining vase statue, DST' },
          { text: 'Just like the old days.', origin: 'Maxwell examining stage, DST' },
          { text: 'Misdirection, the oldest trick in the book. Well played, Charlie.', origin: 'Maxwell examining playbill, DST' },
          { text: 'I think she\'s enjoying this a bit too much.', origin: 'Maxwell examining the enchanted doll, DST' },
          { text: 'I suppose it\'s best to keep up appearances...', origin: 'Maxwell announcing darkness approach, DST' },
          { text: 'Ow! Be gentle, Charlie!', origin: 'Maxwell announcing darkness attack, DST' },
          { text: 'They\'re smaller than I remember... going soft on us, Charlie?', origin: 'Maxwell examining varglet, DST' },
          { text: 'Curious. It smells like roses.', origin: 'Maxwell examining shadow thurible, DST' },
          { text: 'Charlie...', origin: 'Maxwell examining Charlie NPC, DST' },
          { text: 'I\'ll... see to it.', origin: 'Maxwell examining beckoning hand, DST' },
          { text: 'Charlie was the only one who ever kept me in check.', origin: 'Maxwell examining white/black bishop, DST' },
          { text: 'How very dramatic.', origin: 'Maxwell examining non-king play masks, DST' },
          { text: 'It seems the costumes are provided.', origin: 'Maxwell examining non-king play costumes, DST' },
          { text: 'I think that one will fit me nicely.', origin: 'Maxwell examining king costume, DST' },
          { text: 'It seems silly now...', origin: 'Maxwell examining Maxwell statue, DST' },
          { text: 'Darkness is never far from my mind.', origin: 'Maxwell examining dreadstone helmet, DST' },
          { text: 'That smell... both nostalgic and terrifying!', origin: 'Maxwell announcing darkness warn, DST' },
          { text: 'Who\'s afraid of the dark?', origin: 'table lamp, DST' },
          { text: 'What was wrong with my carpet?', origin: 'Maxwell examining lush carpet, DST' },
          { text: 'Darkness is an often underrated accessory.', origin: 'Maxwell examining void cowl, DST' },
          { text: 'Stop attacking my mind!', origin: 'Maxwell examining Sisturn with dark petals, DST' },
          { text: 'Here we go again. Dark magics are returning. The power\'s growing.', origin: 'Maxwell examining Atrium destabilization, DST' },
          { text: 'I wonder if she knows about this...', origin: 'Maxwell examining pure brilliance, DST' },
          { text: 'If only I stuck with these.', origin: 'Maxwell examining deck of cards, DST' },
          { text: 'She has no future ahead of her. A shame.', origin: 'Maxwell examining Billy, DST' },
          { text: 'Hmph. I hope she appreciates this.', origin: 'Maxwell examining Pearl\'s light post, DST' },
          { text: 'Does she really need a statue?', origin: 'Maxwell examining Bee Queen figure, DST' },
          { text: 'Always keep things close to the chest, right pal?', origin: 'Maxwell examining Ancient Guardian figure, DST' },
          { text: 'She doesn\'t understand the full extent of the power she\'s toying with.', origin: 'Maxwell examining time pieces, DST' },
          { text: 'She looks a little bossy.', origin: 'Maxwell examining princess mask, DST' },
          { text: 'I hope she stays dead.', origin: 'Maxwell examining spider queen corpse, DST' },
          { text: 'She\'s ignoring me... the nerve!', origin: 'Maxwell announcing failed moon quay queen offering, DST' },
          { text: 'Now she\'s just showing off.', origin: 'Maxwell examining Lux Aeterna Redux and Commander\'s Helm, DST' },
          { text: 'Let me know your wishes, and I will oblige.', origin: 'Maxwell examining celestial altar idol, DST' },
          { text: 'Some cracks can\'t be mended.', origin: 'Maxwell examining broken shell, DST' },
          { text: 'A pulse of malice and betrayal beats within.', origin: 'Maxwell examining shadow atrium, DST' },
          { text: 'Say, pal, I don\'t look so good...', origin: 'Maxwell despawning at celestial portal, DST' },
          { text: 'I had to try.', origin: 'Maxwell failing Abigail revival, DST' },
          { text: 'Ugh, are you going to follow me everywhere?', origin: 'Maxwell examining security pulse follower, DST' },
          { text: 'I feel protected by an unseen force.', origin: 'Maxwell announcing garlic powder buff, DST' },
          { text: 'With my luck it\'ll lead me to my doom.', origin: 'Maxwell examining waymark compass leading, DST' },
          { text: 'If the ground displeases me, I\'ll pull it up by the roots.', origin: 'Maxwell examining turf-raiser helm, DST' },
          { text: 'Every lovely flower must one day wilt.', origin: 'Maxwell examining wilted flower in end table, DST' },
          { text: 'Enjoy your moment while it last...', origin: 'Maxwell examining fish scale with heavy fish, DST' },
          { text: 'If only life were that simple.', origin: 'Maxwell examining empty frame, DST' },
          { text: 'Good. You sit. Forever.', origin: 'Maxwell examining occupied chair, DST' },
          { text: 'Wrap yourself in the nightmare. Embrace it.', origin: 'Maxwell examining night armor, DST' },
          { text: 'Presto change-o! Ahem... old habit.', origin: 'Maxwell examining clean sweeper, DST' },
          { text: 'The magic beckons!', origin: 'Maxwell examining active lazy deserter, DST' },
          { text: 'I always considered myself the peacock of people.', origin: 'Maxwell examining feather hat, DST' },
          { text: 'Some things can be repaired.', origin: 'Maxwell examining void repair kit, DST' },
          { text: 'I\'m picking up notes of terror, with a hint of dread.', origin: 'Maxwell examining embalming spritz, DST' },
          { text: 'Just like old times.', origin: 'Maxwell examining Broodling, DST' },
          { text: 'This seems cruel.', origin: 'Maxwell examining hornucopia sculpture, DST' },
          { text: 'The most troublesome pair I\'ve ever seen.', origin: 'Maxwell examining Twins of Terror figure, DST' },
          { text: 'Want to see a cool trick? I just need a volunteer...', origin: 'Maxwell examining flash freeze staff, DST' },
          { text: 'It makes me a little nostalgic.', origin: 'Maxwell examining held inactive bernie, DST' },
          { text: 'The show\'s over.', origin: 'Maxwell examining burnt mighty gym, DST' },
          { text: 'History repeats itself.', origin: 'Maxwell examining burnt bookcase, DST' },
          { text: 'I haven\'t had a real sleep in... ages.', origin: 'Maxwell examining Sleepytime Stories, DST' },
          { text: 'Taking some inspiration from the Codex, are we? I\'m flattered.', origin: 'Maxwell examining Lux Aeterna, DST' },
          { text: 'How sickeningly endearing.', origin: 'Maxwell examining dangler/spitter/nurse switcherdoodle, DST' },
          { text: 'Magic isn\'t so easy, is it?', origin: 'Maxwell examining G.E.M.erator out of fuel, DST' },
          { text: 'He\'s a soul sucker, that one.', origin: 'Maxwell examining soul jar, DST' },
          { text: 'Careful, madam. I know where this trail ultimately leaDS.', origin: 'Maxwell examining ageless/second change/rift watch, DST' },
          { text: 'How the tables have turned, worm.', origin: 'Maxwell examining jelly worm, DST' },
          { text: 'You are all ants in my eyes already.', origin: 'Maxwell examining binoculars, DST' },
          { text: 'Takes away the horrors. But who would want that?', origin: 'Maxwell examining fear reducing potion, DST' },
          { text: 'End of the line, pal.', origin: 'Maxwell examining finish line kit, DST' },
          { text: 'My choice has been made. No going back.', origin: 'Maxwell announcing failed beefalo choice attempt, DST' },
          { text: 'This animal commands respect through violence.', origin: 'Maxwell examining catcoon figure, DST' },
          { text: 'Fine! Begone! The Great Maxwell doesn\'t need help for a simple child\'s game.', origin: 'Maxwell announcing ticoon abandonment, DST' },
          { text: 'You were not clever enough to best the great Maxwell!', origin: 'Maxwell\'s found kitcoon announcement, DST' },
          { text: 'Care for a gentleman\'s duel?', origin: 'Maxwell examining glove of challenge, DST' },
          { text: 'If I\'m going to humiliate myself, I can at least do it properly.', origin: 'Maxwell announcing trying to start fight with no pillow, DST' },
          { text: 'Move along. Show\'s over.', origin: 'Maxwell examining burnt dragonfly shrine, DST' },
          { text: 'Enjoying the show, pal?', origin: 'Maxwell examining Broodling spectator, DST' },
          { text: 'A rose huh?', origin: 'Maxwell examining gilded knight\'s chest plate, DST' },
          { text: 'Make up your mind! Friend or foe?', origin: 'Maxwell examining gilded knight figure, DST' },
          { text: 'I would never stoop to such things.', origin: 'Maxwell examining pith pike, DST' },
          { text: 'Allow me to assist. / No need to thank me.', origin: 'Maxwell announcing started/finished revival, DST' },
          { text: 'That was simply undignified.', origin: 'Maxwell announcing revived state, DST' },
          { text: 'My bones are naturally fragile, I\'m afraid.', origin: 'Maxwell examining goat milk, DST' },
          { text: 'So small and obedient. It goes where I direct it.', origin: 'Maxwell examining golf ball, DST' },
          { text: 'It reminds lesser players where the world ends.', origin: 'Maxwell examining golf course wall, DST' },
          { text: 'Must you always be in my way?', origin: 'Maxwell examining golf obstacles, DST' },
          { text: 'Look at you. You\'re useless.', origin: 'Maxwell examining twiggy tree old line, DST' },
          { text: 'Everyone\'s got problems, pal. / Just what do you have to be upset about?', origin: 'Maxwell examining stressed/very stressed plant, DST' },
          { text: 'Thank goodness, I thought it was another wretched statue of me.', origin: 'Maxwell examining Glommer\'s statue, DST' },
          { text: 'The fewer statues the better, I say.', origin: 'Maxwell examining mined Glommer\'s statue, DST' },
          { text: 'Hmph. Impressive sleight of hand.', origin: 'Maxwell examining stagehand walking, DST' },
          { text: 'Adapt or perish.', origin: 'Maxwell examining sea bones, DST' },
          { text: 'Charlie... what are you planning?', origin: 'Maxwell examining nightmare rampart, DST' },
          { text: 'Foul beast! Know your place!', origin: 'Maxwell examining lavae, DST' },
          { text: 'May you never wake.', origin: 'Maxwell examining permafrost pengull asleep, DST' },
          { text: 'You think you can look down on me?', origin: 'Maxwell examining shriek, DST' },
          { text: 'I\'ll leave a bitter taste in your mouth, pal.', origin: 'Maxwell examining rasp, DST' },
          { text: 'What are you smiling at, pal?', origin: 'Maxwell examining rictus, DST' },
          { text: 'You\'ve changed.', origin: 'Maxwell examining possessed mob/possessed other player, DST' },
          { text: 'Of course you don\'t even know how to stay dead.', origin: 'Maxwell examining merm reviving, DST' },
          { text: 'It seems you\'ve lost something, pal.', origin: 'Maxwell examining broken horn gnarwail, DST' },
          { text: 'I\'m sure its delicate appearance is just a ruse for us to let our guard down.', origin: 'Maxwell examining sea weed, DST' },
          { text: 'It\'s happy with me, and I with it.', origin: 'Maxwell examining extra-adorable lavae happy, DST' },
          { text: 'I knew I would make a terrible pa-pa.', origin: 'Maxwell examining lavae egg too cold, DST' },
          { text: 'You thought you could fool me?', origin: 'Maxwell examining held carrat, DST' },
          { text: 'Stop this ridiculous charade, beast.', origin: 'Maxwell examining neutral treeguard, DST' },
          { text: 'Not the castle I had in mind for myself.', origin: 'Maxwell examining glass castle, DST' },
          { text: 'A most tragic and unfitting end.', origin: 'Maxwell examining bone helm, DST' },
          { text: 'Say pal, why don\'t we try to work this out?', origin: 'Maxwell examining Crab King, DST' },
          { text: 'Ah. I thought I\'d run out of people to disappoint.', origin: 'Maxwell examining cracked pearl, DST' },
          { text: 'You wen\'t nosing around places you shouldn\'t have, didn\'t you?', origin: 'Maxwell examining imprisoned nightmare werepig, DST' },
          { text: 'Say pal, why don\'t we talk this out?', origin: 'Maxwell examining freed nightmare werepig, DST' },
          { text: 'It\'s... strange to be so trusted.', origin: 'Maxwell examining Pearl\'s pearl, DST' },
          { text: 'A crown can be a heavy burden...', origin: 'Maxwell examining merm king, DST' },
          { text: 'Old habits die hard... and so will you!', origin: 'Maxwell announcing murderer Maxwell player, DST' },
          { text: 'I\'ll have to pay in blood to bring you back,', origin: 'Maxwell examining ghost Maxwell player, DST' },
          { text: 'I know that look ... What are you up to?', origin: 'Maxwell announcing attacker Maxwell player, DST' },
          { text: 'A complete and utter fraud...', origin: 'Maxwell examining fake kazoo, DST' },
          { text: 'Admittedly, it\'s difficult to maintain balance when you\'re on top.', origin: 'Maxwell examining unbalanced top, DST' },
          { text: 'Not a pawn, but still a minion.', origin: 'Maxwell examining white and black knight, DST' },
          { text: 'They\'re here to help... I\'m beginning to understand.', origin: 'Maxwell announcing vault shadow hand appearance, DST' },
          { text: 'I fear I might have underestimated my prey...', origin: 'Maxwell\'s hunt announcement wrong fork, DST' },
          { text: 'Forgive me if I\'ve lost my taste for music.', origin: 'Maxwell examining creepy forest record, DST' },
          { text: 'You can\'t escape my villainous grasp!', origin: 'Maxwell examining held lunar moth, DST' },
          { text: 'I think it would be best to keep my distance.', origin: 'Maxwell examining greater gestalt, DST' },
          { text: 'I\'m so sorry.', origin: 'Maxwell examining pipspook, DST' },
          { text: 'Stay back, you abomination!', origin: 'Maxwell examining possessed WX chassis, DST' },
          { text: 'Are you certain you wish to return to this world?', origin: 'Maxwell examining ghost Wilson player, DST' },
          { text: 'Let\'s find a heart. I\'ll prepare my incantations.', origin: 'Maxwell examining ghost Wolfgang player, DST' },
          { text: 'If you\'re going to attack, at least finish the job!', origin: 'Maxwell announcing attacker WX player, DST' },
          { text: 'Do not start fights you cannot win!', origin: 'Maxwell announcing murderer Wickerbottom player, DST' },
          { text: 'So ... you\'re a monster after all!', origin: 'Maxwell announcing murderer Webber player, DST' },
          { text: 'Oh dear, whatever will become of your kingdom now?', origin: 'Maxwell examining ghost wurt player, DST' },
          { text: 'I do not wish to quarrel!', origin: 'Maxwell announcing attacker walter player, DST' },
          { text: 'Murderous fiend! I\'ll show you true power!', origin: 'Maxwell announcing murderer wanda player, DST' },
          { text: 'It\'s high time I put that creature down.', origin: 'Maxwell examining announcing wonkey player, DST' },
          { text: 'It slithers all the way down.', origin: 'Maxwell examining eel, DST' },
          { text: 'The product of a very immature magician, perhaps.', origin: 'Maxwell examining bent spork, DST' },
          { text: 'How could you improve on perfection?', origin: 'Maxwell announcing unable to use wardrobe, DST' },
          { text: 'I don\'t like sharing.', origin: 'Maxwell announcing occupied craft station, DST' },
          { text: 'I\'m quite adept at waiting. I\'ve had a lot of practice.', origin: 'Maxwell announcing cannot rummage, DST' },
          { text: 'I am attacked by my own world!', origin: 'Maxwell announcing final sinkhole warning, DST' },
          { text: 'I\'m not sure I really want to give this up.', origin: 'telltale heart, DST' },
          { text: 'It\'s an empty shell of a man.', origin: 'friendly scarecrow, DST' },
          { text: 'What a well dressed figure!', origin: 'Maxwell examining kingly figure, DST' },
          { text: 'Tough crowd.', origin: 'Maxwell examining Mocking Birds, DST' },
          { text: 'It got what it deserved.', origin: 'Maxwell examining withered cave flowers, DST' },
          { text: 'Was it wise to unleash this upon the world?', origin: 'Maxwell examining Odd Skeleton, DST' },
          { text: 'Does this entertain you, beast?', origin: 'Maxwell announcing antlion tribute, DST' },
          { text: 'Someone thinks highly of themselves.', origin: 'Maxwell reacting to other player with bee queen crown line 1, DST' },
          { text: 'Your “Majesty.”', origin: 'Maxwell reacting to other player with bee queen crown line 2, DST' },
          { text: 'Your “Royal Highness.”', origin: 'Maxwell reacting to other player with bee queen crown line 3, DST' },
          { text: 'It\'s deemed me unworthy.', origin: 'Maxwell announcing failed ancient chest combo, DST' },
          { text: 'I\'m not strong enough for this.', origin: 'Maxwell examining queenly figure in shaking state, unimplemented/removed, DST' },
          { text: 'She really expects me to... oh why not.', origin: 'Maxwell examining playbill, unimplemented/removed, DST' },
          { text: 'I hope this makes you happy, Charlie.', origin: 'maxwell examine charlie npc scene 2' },
          { text: 'Hm. I don\'t mind the new look.', origin: 'maxwell examine blighted rocky boss' },
          { text: 'Something horrid in there, no doubt.', origin: 'maxwell examine generic big bat cave' },
          { text: 'It thinks it\'s being clever.', origin: 'maxwell examine shielding rocky boss' },
          { text: 'Better be worth it…', origin: 'maxwell examine rocky boss organ' },
          { text: 'I don\'t even want to know, Charlie.', origin: 'maxwell examine bat boss organ' },
          { text: 'Disgusting. Really, Charlie?', origin: 'maxwell examine worm boss organ' },
          { text: 'Levitation? Amateurs.', origin: 'maxwell examine floating ritual items' },
          { text: 'Charlie? Are you still there?', origin: 'maxwell examine charlie boss' },
          { text: 'H-hey there, pal... Maxwell here. Big fan of, uh... whatever it is you\'re doing.', origin: 'maxwell examine shrouden' },
          { text: 'That\'s not Charlie…', origin: 'maxwell announcing darkness attack after shadow finale' },
          { text: 'Ow! What have you done with Charlie!?', origin: 'maxwell announcing darkness attack after shadow finale' },
         
        ],
